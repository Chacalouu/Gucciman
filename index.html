<style>
:root {
  --bg: #050505;
  --bg2: #0c0c0c;
  --card: #111111;
  --card2: #161616;
  --line: #222;
  --text: #f4f4f4;
  --muted: #8a8a8a;
  --dim: #5c5c5c;
  --live: #e11d2e;
  --ok: #2fbf71;
  --warn: #c9a227;
  --bad: #d14b4b;
  --safe: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #000; color: var(--text); }
body {
  font-family: "Inter", "SF Pro Text", system-ui, -apple-system, sans-serif;
  overflow: hidden;
}
#app {
  max-width: 430px;
  margin: 0 auto;
  height: 100%;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  position: relative;
  border-left: 1px solid #111;
  border-right: 1px solid #111;
}
header.appbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 16px 10px;
  border-bottom: 1px solid var(--line);
  background: #000;
  flex-shrink: 0;
}
.splash {
  position: absolute; inset: 0;
  background: #000;
  z-index: 80;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  overflow: hidden;
}
.splash.through {
  background: transparent;
  pointer-events: none;
}
.splash img {
  width: 96px; height: 96px;
  border-radius: 20px;
  background: #000;
  border: 1px solid #222;
  animation: splashPulse 2.5s ease-in-out both;
  transform-origin: center center;
}
.splash.through img {
  animation: splashThrough 0.3s cubic-bezier(.2,.7,.2,1) forwards;
  border-color: transparent;
}
.splash strong {
  letter-spacing: 0.28em;
  font-size: 14px;
  color: #f4f4f4;
  animation: splashIn 0.5s ease both;
}
.splash.through strong { opacity: 0; transition: opacity .12s linear; }
@keyframes splashIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}
@keyframes splashPulse {
  0% { transform: scale(.82); opacity: 0; }
  18% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.06); }
  100% { transform: scale(1); }
}
@keyframes splashThrough {
  0% { transform: scale(1); opacity: 1; filter: blur(0); }
  100% { transform: scale(18); opacity: 0; filter: blur(2px); }
}
.logo {
  width: 34px; height: 34px;
  border-radius: 8px;
  background: #000;
  border: 1px solid #2a2a2a;
  object-fit: cover;
}
.brand { display: flex; flex-direction: column; }
.brand strong { font-size: 16px; letter-spacing: 0.18em; font-weight: 700; }
.brand span { font-size: 10px; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; }
.header-meta { margin-left: auto; font-size: 11px; color: var(--muted); text-align: right; }

main {
  flex: 1;
  overflow: auto;
  padding: 12px 14px 18px;
  padding-bottom: calc(86px + var(--safe));
}
.tab { display: none; }
.tab.active { display: block; }

.row { display: flex; align-items: center; gap: 8px; }
.space { justify-content: space-between; }

h2.sec {
  font-size: 12px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 600;
  margin: 16px 2px 8px;
}
h2.sec:first-child { margin-top: 4px; }

.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto;
  border: 1px solid #2a2a2a;
  background: #0e0e0e;
  color: #cfcfcf;
  border-radius: 999px;

  font-size: 11px;
  letter-spacing: 0.04em;
}
.chip.on { background: #fff; color: #000; border-color: #fff; font-weight: 600; }

.match {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px;
  margin-bottom: 8px;
}
.match.live {
  padding: 16px 14px;
  background: linear-gradient(180deg, #141414 0%, #0d0d0d 100%);
  border-color: #2a1518;
  box-shadow: inset 0 0 0 1px rgba(225,29,46,0.18);
}
.match.finished { opacity: 0.92; }
.league-tag { font-size: 10px; color: var(--dim); letter-spacing: 0.1em; text-transform: uppercase; }
.live-pill {

}
.dot {
  width: 7px; height: 7px; border-radius: 50%; background: var(--live);
  box-shadow: 0 0 0 0 rgba(225,29,46,.7);
  animation: pulse 1.4s infinite;
}
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(225,29,46,.55); }
  70% { box-shadow: 0 0 0 8px rgba(225,29,46,0); }
  100% { box-shadow: 0 0 0 0 rgba(225,29,46,0); }
}
.scoreboard { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; margin-top: 8px; }
.team { display: flex; align-items: center; gap: 8px; min-width: 0; }

.crest { width: 26px; height: 26px; object-fit: contain; }
.match.live .crest { width: 34px; height: 34px; }
.tname { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.match.live .tname { font-size: 15px; }
.score {

  font-weight: 750;
  font-size: 22px;
  letter-spacing: 0.04em;
  min-width: 64px;
  text-align: center;
}
.match.live .score { font-size: 32px; min-width: 84px; }
.clock { text-align: center; font-size: 11px; color: var(--muted); margin-top: 2px; }
.match.live .clock { color: var(--live); font-weight: 700; font-size: 12px; }
.events { margin-top: 10px; display: flex; flex-direction: column; gap: 4px; }
.ev {

.search {

  font-size: 14px;
  outline: none;

  background: #1a1a1a; object-fit: cover; border: 1px solid #2a2a2a;
}
.pname { font-size: 14px; font-weight: 600; }
.pmeta { font-size: 11px; color: var(--muted); }
.icon-btn, .btn {

}
.btn {

.btn.ghost { background: transparent; color: #ddd; border: 1px solid #2a2a2a; }

.btn.ok { background: #0f1a14; color: #b7ebc9; border: 1px solid #1d3a28; }
.btn.warn { background: #1a170c; color: #ead9a0; border: 1px solid #3a3418; }
.btn.full { width: 100%; }
.btn.sm { padding: 6px 10px; font-size: 12px; border-radius: 8px; }
.add {

}
.add.on { background: #1a1a1a; color: #fff; border: 1px solid #333; }
.trash {

.trash:active { color: #fff; border-color: #555; }

}
.rank .pname, .rank .pmeta {

.pos { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }

.stats-grid {

}
.stat {

}
.stat .n { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat .l { font-size: 10px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 4px; }
.stat.pos .n { color: var(--ok); }
.stat.neg .n { color: var(--bad); }

.form { display: flex; flex-direction: column; gap: 8px; margin: 8px 0 14px; }
label.field { font-size: 11px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
select, input[type="number"], input[type="text"] {

}
.seg button.on { background: #fff; color: #000; border-color: #fff; font-weight: 650; }

.bet {

}
.status.open { color: #ddd; }

.status.lost { color: var(--bad); border-color: #3a1c20; }

.actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }

nav.tabs {

  border-top: 1px solid #1c1c1c;
  padding: 8px 6px calc(10px + var(--safe));
}

  background: none; border: 0; color: #666; font-size: 10px; letter-spacing: 0.08em;
  text-transform: uppercase; display: flex; flex-direction: column; align-items: center; gap: 4px;
  cursor: pointer; font-weight: 600;
}
nav.tabs button svg { width: 20px; height: 20px; }

.date-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }

}
.date-label { font-size: 13px; font-weight: 600; }

.toast {

  font-size: 13px; font-weight: 600; display: none; text-align: center;
}
.modal-bg {

}

.fav-hit {

.analyse-card { margin-bottom: 10px; }

.xi {

  function loadJson(key, fallback) {
    try { return JSON.parse(localStorage.getItem(key)) || fallback; }
    catch { return fallback; }
  }
  function saveJson(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

  function favs() { return loadJson(LS_FAV, []); }

  function cachedStats() {

    const s = loadJson(LS_SETTINGS, {});

  function toast(msg) {

  function ymd(d) {
    const x = new Date(d);
    const m = String(x.getMonth() + 1).padStart(2, "0");
    const day = String(x.getDate()).padStart(2, "0");
    return `${x.getFullYear()}${m}${day}`;
  }
  function prettyDate(d) {
    return new Intl.DateTimeFormat("fr-FR", { weekday: "short", day: "numeric", month: "short" }).format(d);
  }
  function kickoff(iso) {
    return new Intl.DateTimeFormat("fr-FR", { hour: "2-digit", minute: "2-digit" }).format(new Date(iso));
  }
  function euro(n) {
    const v = Number(n) || 0;
    return v.toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
  }
  function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }

  function headshot(id) {
    return `https://a.espncdn.com/i/headshots/soccer/players/full/${id}.png`;
  }

  async function fetchJSON(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error("http " + res.status);
    return res.json();
  }

  function parseMatch(event, league) {
    const comp = (event.competitions || [])[0] || {};
    const status = (comp.status || event.status || {}).type || {};
    const clock = (comp.status || event.status || {}).displayClock || "";
    const competitors = comp.competitors || [];
    const home = competitors.find((c) => c.homeAway === "home") || competitors[1] || {};
    const away = competitors.find((c) => c.homeAway === "away") || competitors[0] || {};
    const stateName = status.state || "";
    const statusBlob = [status.name, status.description, status.detail, status.shortDetail].filter(Boolean).join(" ");
    const isDone = !!(status.completed || stateName === "post" || /STATUS_FULL_TIME|FULL[ _-]?TIME|\bFT\b/i.test(statusBlob));
    const isHT = !isDone && /STATUS_HALFTIME|\bHALFTIME\b|\bHALF[ -]?TIME\b|\bMI[- ]TEMPS\b|\bPAUSE\b/.test(statusBlob)
      && !/\b(1st|2nd|FIRST|SECOND)\s+HALF\b/i.test(statusBlob);
    const isLive = !isDone && (isHT || stateName === "in" || /LIVE|IN_PLAY/i.test(status.name || ""));
    const details = comp.details || [];
    const scorers = [];
    details.forEach((d) => {
      const text = (d.type && d.type.text) || "";
      const athletes = d.athletesInvolved || [];
      if (d.scoringPlay || /goal/i.test(text)) {
        const scorer = athletes[0];
        const assist = athletes[1];
        scorers.push({
          minute: (d.clock && d.clock.displayValue) || "",
          kind: d.ownGoal ? "csc" : d.penaltyKick ? "pen" : "but",
          scorer: scorer ? scorer.displayName : "?",
          scorerId: scorer ? String(scorer.id) : "",
          assist: assist ? assist.displayName : "",
          assistId: assist ? String(assist.id) : "",
          teamId: (d.team && d.team.id) || "",
        });
      } else if (/assist/i.test(text) && athletes[0]) {
        const last = scorers[scorers.length - 1];
        if (last && !last.assist) {
          last.assist = athletes[0].displayName;
          last.assistId = String(athletes[0].id);
        }
      }
    });
    return {
      id: event.id,
      leagueId: league.id,
      league: league.name,
      date: event.date,
      isLive,
      isHT,
      isDone,
      clock: isDone ? "FIN" : isHT ? "MT" : (isLive ? clock : kickoff(event.date)),
      home: {
        id: String((home.team || {}).id || ""),
        name: (home.team || {}).shortDisplayName || (home.team || {}).displayName || "?",
        full: (home.team || {}).displayName || (home.team || {}).shortDisplayName || "",
        logo: (home.team || {}).logo,
        score: home.score || "0",
        form: home.form || "",
        record: ((home.records || [])[0] || {}).summary || "",
      },
      away: {
        id: String((away.team || {}).id || ""),
        name: (away.team || {}).shortDisplayName || (away.team || {}).displayName || "?",
        full: (away.team || {}).displayName || (away.team || {}).shortDisplayName || "",
        logo: (away.team || {}).logo,
        score: away.score || "0",
        form: away.form || "",
        record: ((away.records || [])[0] || {}).summary || "",
      },
      scorers,
    };
  }

  function assistKey(m, s) {
    return `${m.id}|${s.minute}|${s.scorer}`;
  }
  function assistStore() { return loadJson(LS_ASSIST, {}); }
  function applyAssistCache(matches) {
    const cache = assistStore();
    matches.forEach((m) => {
      (m.scorers || []).forEach((s) => {
        if (s.assist) {
          cache[assistKey(m, s)] = { assist: s.assist, assistId: s.assistId || "" };
          return;
        }
        const hit = cache[assistKey(m, s)];
        if (hit && hit.assist) {
          s.assist = hit.assist;
          s.assistId = hit.assistId || "";
        }
      });
    });
    saveJson(LS_ASSIST, cache);
  }
  function saveAssists(matches) {
    const cache = assistStore();
    matches.forEach((m) => {
      (m.scorers || []).forEach((s) => {
        if (s.assist) cache[assistKey(m, s)] = { assist: s.assist, assistId: s.assistId || "" };
      });
    });
    saveJson(LS_ASSIST, cache);
  }
  function keepScroll(fn) {
    const y = main.scrollTop;
    fn();
    main.scrollTop = y;
  }

  async function loadMatches(opts = {}) {
    const silent = !!opts.silent;
    if (!silent) {
      state.loading = true;
      render();
    }
    const date = ymd(state.date);
    const list = state.league === "all" ? LEAGUES : LEAGUES.filter((l) => l.id === state.league);
    const results = await Promise.allSettled(
      list.map((l) => fetchJSON(`https://site.web.api.espn.com/apis/site/v2/sports/soccer/${l.id}/scoreboard?dates=${date}`).then((d) => ({ l, d })))
    );
    const matches = [];
    results.forEach((r) => {
      if (r.status !== "fulfilled") return;
      const { l, d } = r.value;
      (d.events || []).forEach((ev) => matches.push(parseMatch(ev, l)));
    });
    matches.sort((a, b) => {
      if (a.isLive !== b.isLive) return a.isLive ? -1 : 1;
      if (a.isDone !== b.isDone) return a.isDone ? 1 : -1;
      return new Date(a.date) - new Date(b.date);
    });
    applyAssistCache(matches);
    detectGoals(matches);
    applyLineupCache(matches);
    state.matches = matches;
    state.loading = false;
    keepScroll(() => render());
    await enrichLineups(matches);
    await enrichAssists(matches);
    await enrichAssistsFotmob(matches);
    saveAssists(matches);
    trackDecisive(matches);
    autoSettleBets(matches);
    keepScroll(() => render());
  }

  function applyLineupCache(matches) {
    matches.forEach((m) => {
      if (state.lineups[m.id]) m.starters = state.lineups[m.id];
    });
  }
  async function enrichLineups(matches) {
    const need = matches.filter((m) => !m.isDone).slice(0, 24);
    await Promise.allSettled(need.map(async (m) => {
      try {
        const d = await fetchJSON(`https://site.web.api.espn.com/apis/site/v2/sports/soccer/${m.leagueId}/summary?event=${m.id}`);
        const starters = [];
        (d.rosters || []).forEach((side) => {
          (side.roster || []).forEach((r) => {
            if (!r.starter || !r.athlete) return;
            starters.push({
              id: String(r.athlete.id || ""),
              name: r.athlete.displayName || r.athlete.fullName || "",
            });
          });
        });
        if (starters.length) {
          m.starters = starters;
          state.lineups[m.id] = starters;
        }
      } catch { /* pas encore de compo */ }
    }));
  }
  function starterNote(m) {
    if (m.isLive || m.isDone || m.isHT) return "";
    if (!m.starters || !m.starters.length) return "";
    const mine = favs();
    const hits = [];
    const seen = new Set();
    m.starters.forEach((s) => {
      const hit = mine.find((p) => String(p.id) === String(s.id) || (p.name && s.name && p.name.toLowerCase() === s.name.toLowerCase()));
      if (hit && !seen.has(String(hit.id))) {
        seen.add(String(hit.id));
        hits.push(hit.name);
      }
    });
    if (!hits.length) return "";
    if (hits.length === 1) return hits[0] + " est titulaire";
    if (hits.length === 2) return hits[0] + " et " + hits[1] + " sont titulaires";
    return hits.slice(0, -1).join(", ") + " et " + hits[hits.length - 1] + " sont titulaires";
  }

  function parseAssistedBy(text) {
    const m = String(text || "").match(/Assisted by\s+([A-Za-zÀ-ÿ'.\- ]+?)(?:\s+with\b|[.]|$)/i);
    return m ? m[1].trim() : "";
  }

  async function enrichAssists(matches) {
    const need = matches.filter((m) => (m.scorers || []).some((s) => !s.assist) && (m.isLive || m.isDone));
    if (!need.length) return;
    const results = await Promise.allSettled(need.map(async (m) => {
      const data = await fetchJSON(`https://site.web.api.espn.com/apis/site/v2/sports/soccer/${m.leagueId}/summary?event=${m.id}`);
      const events = data.keyEvents || [];
      const goals = events.filter((ev) => ev.scoringPlay);
      m.scorers.forEach((s) => {
        if (s.assist) return;
        const hit = goals.find((ev) => {
          const clock = (ev.clock && ev.clock.displayValue) || "";
          return clock === s.minute;
        }) || goals.find((ev) => {
          const names = (ev.participants || []).map((p) => (p.athlete || {}).displayName);
          return names[0] === s.scorer;
        });
        if (!hit) return;
        const parts = hit.participants || [];
        if (parts[1] && parts[1].athlete) {
          s.assist = parts[1].athlete.displayName;
          s.assistId = String(parts[1].athlete.id || "");
        } else {
          const name = parseAssistedBy(hit.text);
          if (name) s.assist = name;
        }
      });
    }));
    const still = matches.filter((m) => (m.scorers || []).some((s) => !s.assist) && (m.isLive || m.isDone));
    if (still.length) await enrichAssistsScore(still);
    return results;

  function normName(s) {

  function namesMatch(a, b) {

    if (na.includes(nb) || nb.includes(na)) return true;
    const ta = new Set(na.split(" ").filter((w) => w.length > 2));
    const tb = nb.split(" ").filter((w) => w.length > 2);
    return tb.filter((w) => ta.has(w)).length >= 1;

  async function enrichAssistsScore(matches) {
    const bySlug = {};
    matches.forEach((m) => {
      const slug = SCORE_LEAGUES[m.leagueId];
      if (!slug) return;
      (bySlug[slug] ||= []).push(m);
    });
    for (const slug of Object.keys(bySlug)) {
      let events;
      try { events = await fetchJSON("https://api.thescore.com/" + slug + "/events"); }
      catch { continue; }
      if (!Array.isArray(events)) continue;
      for (const m of bySlug[slug]) {
        const day = (m.date || "").slice(0, 10);
        const cand = events.filter((ev) => {
          const gd = ev.game_date || "";
          if (day && !gd.includes(day) && !gd.includes(new Date(m.date).toUTCString().slice(5, 16))) {
            const d = new Date(gd);
            const md = new Date(m.date);
            if (isNaN(d) || isNaN(md)) return false;
            if (d.toISOString().slice(0,10) !== md.toISOString().slice(0,10)) return false;
          }
          const home = (ev.home_team || {}).name || (ev.home_team || {}).full_name || "";
          const away = (ev.away_team || {}).name || (ev.away_team || {}).full_name || "";
          return (namesMatch(home, m.home.name) && namesMatch(away, m.away.name))
              || (namesMatch(home, m.away.name) && namesMatch(away, m.home.name));
        });
        const ev = cand[0];
        if (!ev) continue;
        let pbp;
        try { pbp = await fetchJSON("https://api.thescore.com/" + slug + "/events/" + ev.id + "/play_by_play_records"); }
        catch { continue; }
        if (!Array.isArray(pbp)) continue;
        const goals = pbp.filter((r) => (r.category || "") === "Goal");
        m.scorers.forEach((s) => {
          if (s.assist) return;
          const min = parseInt(String(s.minute).replace(/\D/g, ""), 10);
          const hit = goals.find((g) => {
            const gn = (g.player && (g.player.full_name || g.player.name)) || "";
            return namesMatch(gn, s.scorer) && (!min || g.minutes === min || Math.abs((g.minutes || 0) - min) <= 1);
          }) || goals.find((g) => namesMatch((g.player && (g.player.full_name || g.player.name)) || "", s.scorer));
          if (!hit) return;
          const as = hit.assist;
          if (as && (as.full_name || as.name)) {
            s.assist = as.full_name || as.name;
            s.assistId = String(as.id || "");
          } else {
            const name = parseAssistedBy(hit.description);
            if (name) s.assist = name;
          }
        });
      }
    }
  }

  function evalSelection(sel, matches) {
    const m = matchById(sel.matchId, matches);
    if (!m || !m.isDone) return "open";
    const hg = Number(m.home.score) || 0;
    const ag = Number(m.away.score) || 0;
    const tot = hg + ag;
    const res = hg > ag ? "1" : hg < ag ? "2" : "N";
    const mk = sel.market;
    if (mk === "1n2") return sel.pick === res ? "won" : "lost";
    if (mk === "dc") {
      if (sel.pick === "1N") return res !== "2" ? "won" : "lost";
      if (sel.pick === "N2") return res !== "1" ? "won" : "lost";
    }
    if (mk === "btts") {
      const yes = hg > 0 && ag > 0;
      return (sel.pick === "oui" ? yes : !yes) ? "won" : "lost";
    }
    if (mk === "goals") {
      const line = Number(sel.line);
      if (sel.pick === "over") return tot > line ? "won" : "lost";
      if (sel.pick === "under") return tot < line ? "won" : "lost";
      if (sel.pick === "exact") return tot === line ? "won" : "lost";

      if (typ === "decisif") return goals.length || assists.length ? "won" : "lost";

      if (typ === "buteur_2mt") return g2.length ? "won" : "lost";
      if (typ === "buteur_passeur") return goals.length && assists.length ? "won" : "lost";

    if (mk === "1n2") sel.pick = state.betPick || "1";
    else if (mk === "dc") sel.pick = state.betPick === "N2" ? "N2" : "1N";
    else if (mk === "btts") sel.pick = state.betBtts || "oui";
    else if (mk === "goals") {
      sel.pick = ["over","under","exact"].includes(state.betPick) ? state.betPick : "over";
      sel.line = Number(state.betLine) || 2.5;
    } else if (mk === "player") {
      const player = favs().find((p) => String(p.id) === String(state.betPlayer));
      if (!player) return toast("Choisis un joueur");
      sel.playerId = player.id;
      sel.playerName = player.name;
      sel.playerMarket = state.betType || "buteur";
    }
    state.slip.push(sel);
    state.betOdds = "";
    toast("Ajouté au coupon");
    render();

  function removeSlip(id) {
    state.slip = state.slip.filter((s) => s.id !== id);
    render();
  }
  function createBet() {
    if (!state.slip.length) return toast("Coupon vide");
    const stake = Number(state.betStake);
    if (!(stake > 0)) return toast("Mise invalide");
    const isCombo = state.slip.length > 1;
    const odds = comboOdds(state.slip);
    const list = bets();
    list.unshift({
      id: uid(),
      type: isCombo ? "combo" : "single",
      selections: state.slip.slice(),
      stake,
      odds,
      potential: +(stake * odds).toFixed(2),
      status: "open",
      createdAt: Date.now(),
    });
    saveJson(LS_BETS, list);
    state.slip = [];
    state.betStake = "";
    toast(isCombo ? "Combiné enregistré" : "Pari enregistré");
    autoSettleBets(state.matches);
    render();

  function deleteBet(id) {
    saveJson(LS_BETS, bets().filter((b) => b.id !== id));
    render();
  }
  function removeBetSelection(betId, selId) {
    const list = bets().map((b) => {
      if (b.id !== betId) return b;
      const sels = (b.selections || []).filter((s, i) => String(s.id || i) !== String(selId));
      if (!sels.length) return null;
      const odds = comboOdds(sels);
      return {
        ...b,
        selections: sels,
        type: sels.length > 1 ? "combo" : "single",
        odds,
        potential: +(Number(b.stake) * odds).toFixed(2),
        status: "open",
        gain: 0,
        profit: 0,
        settledAt: null,
      };
    }).filter(Boolean);
    saveJson(LS_BETS, list);
    autoSettleBets(state.matches);
    render();
  }
  function settle(id, status) {
    const list = bets().map((b) => {
      if (b.id !== id) return b;
      let profit = 0, gain = 0;
      if (status === "won") { gain = +(b.stake * b.odds).toFixed(2); profit = +(gain - b.stake).toFixed(2); }
      else if (status === "lost") { gain = 0; profit = -b.stake; }
      else { gain = b.stake; profit = 0; }
      return { ...b, status, gain, profit, settledAt: Date.now() };
    });
    saveJson(LS_BETS, list);
    render();
  }
  function autoSettleBets(matches) {
    const list = bets();
    let changed = false;
    const next = list.map((b) => {
      if (b.status && b.status !== "open") return b;
      const sels = b.selections || [];
      if (!sels.length) return b;
      const results = sels.map((s) => evalSelection(s, matches));
      if (results.some((r) => r === "lost")) {
        changed = true;
        return { ...b, status: "lost", gain: 0, profit: -b.stake, settledAt: Date.now() };
      }
      if (results.every((r) => r === "won")) {
        const gain = +(b.stake * b.odds).toFixed(2);
        changed = true;
        return { ...b, status: "won", gain, profit: +(gain - b.stake).toFixed(2), settledAt: Date.now() };
      }
      return b;
    });
    if (changed) saveJson(LS_BETS, next);
  }
  function betSummary() {
    const list = bets();
    const settled = list.filter((b) => b.status === "won" || b.status === "lost");
    const mise = settled.reduce((s, b) => s + Number(b.stake || 0), 0);
    const gains = settled.reduce((s, b) => s + (b.status === "won" ? Number(b.stake) * Number(b.odds) : 0), 0);
    return { mise, gains, benef: gains - mise };
  }

  function detectGoals(matches) {
    const now = Date.now();
    let flash = false;
    matches.forEach((m) => {
      const key = String(m.home.score) + "-" + String(m.away.score);
      const prev = state.scoreSnap[m.id];
      state.scoreSnap[m.id] = key;
      if (prev == null || prev === key) return;
      const [ph, pa] = prev.split("-").map((n) => Number(n) || 0);
      const nh = Number(m.home.score) || 0;
      const na = Number(m.away.score) || 0;
      if (nh + na > ph + pa) {
        state.goalUntil[m.id] = now + 5000;
        flash = true;
        if (getSettings().vibrateGoals && navigator.vibrate) {
          navigator.vibrate([35, 40, 35]);
        }
      }
    });
    if (flash) {
      clearTimeout(detectGoals._t);
      detectGoals._t = setTimeout(() => {
        if (state.tab === "matches") keepScroll(() => render());
      }, 5200);
    }
  }

      ${!state.slip.length ? `<div class="empty">Une sélection = simple. Plusieurs = combiné (côtes multipliées, un faux = perdu).</div>` : `${state.slip.map((sel)=>`<article class="bet"><div class="bet-top"><div class="pname">${selLabel(sel)}</div><span class="status open">${Number(sel.odds).toFixed(2)}</span></div><button class="btn sm ghost" data-rmslip="${sel.id}">Retirer</button></article>`).join("")}<div class="pmeta" style="margin:8px 2px">Côte totale ${slipOdds.toFixed(2)}</div><label class="field">Mise (€)</label><input id="betStake" type="number" min="0" step="0.5" value="${escapeAttr(state.betStake)}" placeholder="10" /><button class="btn full" id="placeBet">${state.slip.length > 1 ? "Valider le combiné" : "Valider le ticket"}</button>`}
      <h2 class="sec">Mes tickets</h2>
      ${!list.length ? `<div class="empty">Aucun pari pour l'instant.</div>` : list.map((b)=>`<article class="bet"><div class="bet-top"><div><div class="pname">${b.type==="combo"?"Combiné":"Simple"} · ${euro(b.stake)} @ ${Number(b.odds||0).toFixed(2)}</div></div><span class="status ${b.status}">${statusLabel(b.status)}</span></div>${(b.selections||[]).length ? (b.selections||[]).map((sel,i)=>{ const st = evalSelection(sel, state.matches); const mk = st==="won" ? " ✅" : st==="lost" ? " ❌" : ""; return `<div class="bet-leg"><span>${selLabel(sel)} · ${Number(sel.odds).toFixed(2)}${mk}</span><button class="btn sm ghost" data-rmsel="${b.id}" data-sel="${sel.id || i}">Retirer</button></div>`; }).join("") : `<div class="pmeta">${(b.playerName||"")+" · "+typeLabel(b.type)}</div>`}<div class="pmeta" style="margin-top:6px">Gain pot. ${euro(b.potential)}${b.status==="won"?` · +${euro(b.profit)}`:b.status==="lost"?` · ${euro(b.profit)}`:""}</div><div class="actions"><button class="btn sm ghost" data-delbet="${b.id}">Supprimer le ticket</button></div></article>`).join("")}
    `;
  }


  function fact(n) { let r = 1; for (let i = 2; i <= n; i++) r *= i; return r; }
  function poisson(k, lam) { return Math.exp(-lam) * Math.pow(lam, k) / fact(k); }
  function teamPower(form, record) {
    let ppg = 1.2;
    const rec = String(record || "").match(/(\d+)\s*-\s*(\d+)\s*-\s*(\d+)/);
    if (rec) {
      const w = +rec[1], d = +rec[2], l = +rec[3];
      const g = w + d + l;
      if (g) ppg = (3 * w + d) / g;
    }
    const f = String(form || "").toUpperCase();
    let fp = 0, n = 0;
    for (const ch of f) {
      if (ch === "W") { fp += 3; n++; }
      else if (ch === "D") { fp += 1; n++; }
      else if (ch === "L") { n++; }
    }
    const formPpg = n ? fp / n : ppg;
    return Math.max(0.25, Math.min(2.9, 0.58 * ppg + 0.42 * formPpg));
  }
  function analyzeMatch(m) {
    const ph = teamPower(m.home.form, m.home.record);
    const pa = teamPower(m.away.form, m.away.record);
    const diff = ph - pa;
    let lh = 1.18 + diff * 0.62 + 0.22;
    let la = 1.02 - diff * 0.58;
    lh = Math.max(0.45, Math.min(2.7, lh));
    la = Math.max(0.4, Math.min(2.5, la));
    const grid = [];
    let p1 = 0, pN = 0, p2 = 0, best = { h: 1, a: 1, p: 0 };
    for (let i = 0; i <= 5; i++) {
      for (let j = 0; j <= 5; j++) {
        const p = poisson(i, lh) * poisson(j, la);
        grid.push({ i, j, p });
        if (i > j) p1 += p; else if (i === j) pN += p; else p2 += p;
        if (p > best.p) best = { h: i, a: j, p };
      }
    }
    const tot = p1 + pN + p2 || 1;
    return {
      p1: Math.round(1000 * p1 / tot) / 10,
      pN: Math.round(1000 * pN / tot) / 10,
      p2: Math.round(1000 * p2 / tot) / 10,
      score: best.h + "–" + best.a,
      scorePct: Math.round(1000 * best.p / tot) / 10,
      xg: (lh + la).toFixed(1),
    };
  }
  function teamWatchList(team) {
    const names = [team.name, team.full].filter(Boolean);
    const stats = cachedStats();
    const pool = [];
    const seen = new Set();
    const add = (p) => {
      const id = String(p.id || p.name);
      if (seen.has(id)) return;
      seen.add(id);
      const st = stats[p.id] || {};
      pool.push({ id: p.id, name: p.name, team: p.team || "", ga: Number(st.ga) || 0 });
    };
    favs().forEach(add);
    (CATALOG || []).forEach(add);
    const hit = pool.filter((p) => names.some((n) => {
      const a = String(n || "").toLowerCase();
      const b = String(p.team || "").toLowerCase();
      return a && b && (a === b || a.includes(b) || b.includes(a));
    }));
    hit.sort((a, b) => b.ga - a.ga);
    return hit;
  }
  function formBoxes(form) {
    const seq = String(form || "").toUpperCase().replace(/[^WDL]/g, "").slice(-5);
    if (!seq) return "";
    return `<div class="form-boxes">${[...seq].map((ch) => {
      if (ch === "W") return `<i class="fb w">V</i>`;
      if (ch === "D") return `<i class="fb n">N</i>`;
      return `<i class="fb l">D</i>`;
    }).join("")}</div>`;
  }
  function watchPlayers(m) {
    const stats = cachedStats();
    const mine = favs();
    const matchTeam = (p, team) => {
      const a = String(p.team || "").toLowerCase();
      const names = [team.name, team.full].map((x) => String(x || "").toLowerCase()).filter(Boolean);
      return a && names.some((n) => n === a || n.includes(a) || a.includes(n));
    };
    const pick = (team) => mine.filter((p) => matchTeam(p, team)).sort((a, b) => (Number((stats[b.id] || {}).ga) || 0) - (Number((stats[a.id] || {}).ga) || 0));
    const h = pick(m.home);
    const a = pick(m.away);
    const out = [];
    if (h[0]) out.push({ ...h[0], side: m.home.name });
    if (a[0]) out.push({ ...a[0], side: m.away.name });
    if (out.length < 2 && h[1]) out.push({ ...h[1], side: m.home.name });
    if (out.length < 2 && a[1]) out.push({ ...a[1], side: m.away.name });
    return out.slice(0, 2);
  }
  function renderAnalyse() {
    const list = state.matches.slice().sort((a, b) => {
      if (a.isLive !== b.isLive) return a.isLive ? -1 : 1;
      return new Date(a.date) - new Date(b.date);
    });
    if (state.loading) return `<div class="loading">Analyse des matchs…</div>`;
    if (!list.length) return `<div class="empty">Aucun match à analyser pour ce jour. Va d’abord sur Matchs.</div>`;
    return `
      <h2 class="sec">Analyse du jour</h2>
      <p class="pmeta" style="margin:0 2px 12px">1-N-2 et score issus de la forme + bilan ESPN. Joueurs à suivre parmi tes favoris et la base.</p>
      ${list.map((m) => {
        const a = analyzeMatch(m);
        const watch = watchPlayers(m);
        return `<article class="match analyse-card">
          <div class="row space match-head">
            <span class="league-tag">${m.league}</span>
            ${statusBadge(m)}
          </div>
          <div class="scoreboard">
            <div class="team"><span class="tname">${m.home.name}</span>${formBoxes(m.home.form)}</div>
            <div><div class="score">${a.score}</div><div class="clock">plus probable · ${a.scorePct}%</div></div>
            <div class="team away"><span class="tname">${m.away.name}</span>${formBoxes(m.away.form)}</div>
          </div>
          <div class="an-bars">
            <div class="an-row"><span>1</span><div class="bar"><i style="width:${a.p1}%"></i></div><b>${a.p1}%</b></div>
            <div class="an-row"><span>N</span><div class="bar"><i style="width:${a.pN}%"></i></div><b>${a.pN}%</b></div>
            <div class="an-row"><span>2</span><div class="bar"><i style="width:${a.p2}%"></i></div><b>${a.p2}%</b></div>
          </div>
          ${watch.length ? `<div class="watch">${watch.map((p) => `<div class="watch-p"><b>${p.name}</b><span>${p.side}</span></div>`).join("")}</div>` : ""}
        </article>`;
      }).join("")}
    `;
  }

  function renderSettings() {
    const s = getSettings();
    return `
      <h2 class="sec">Réglages</h2>
      <article class="bet">
        <div class="bet-top">
          <div>

  function escapeAttr(s) {

  }

  function render() {
    if (state.tab === "matches") main.innerHTML = renderMatches();
    else if (state.tab === "favs") main.innerHTML = renderFavs();
    else if (state.tab === "rank") main.innerHTML = renderRank();
    else if (state.tab === "bets") main.innerHTML = renderBets();
    else if (state.tab === "analyse") main.innerHTML = renderAnalyse();
    else main.innerHTML = renderSettings();
    bind();
  }

  function bind() {
    $("#dPrev")?.addEventListener("click", () => {
      state.date = new Date(state.date.getTime() - 86400000);
      loadMatches();
    });
    $("#dNext")?.addEventListener("click", () => {
      state.date = new Date(state.date.getTime() + 86400000);
      loadMatches();
    });
    $("#leagueChips")?.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-lg]");

    main.querySelectorAll("[data-star]").forEach((btn) => {

    main.querySelectorAll("[data-add]").forEach((btn) => {

    });
    main.querySelectorAll("[data-market]").forEach((btn) => {
      btn.addEventListener("click", () => {
        state.betMarket = btn.dataset.market;
        if (state.betMarket === "1n2") state.betPick = "1";
        if (state.betMarket === "dc") state.betPick = "1N";
        if (state.betMarket === "goals") state.betPick = "over";
        render();
      });
    });
    main.querySelectorAll("[data-pick]").forEach((btn) => {
      btn.addEventListener("click", () => { state.betPick = btn.dataset.pick; render(); });
    });
    main.querySelectorAll("[data-btts]").forEach((btn) => {

    main.querySelectorAll("[data-rmslip]").forEach((btn) => {

    });
    $("#betPlayer")?.addEventListener("change", (e) => { state.betPlayer = e.target.value; });
    $("#betMatch")?.addEventListener("change", (e) => { state.betMatch = e.target.value; });
    $("#betLine")?.addEventListener("change", (e) => { state.betLine = e.target.value; });
    $("#betStake")?.addEventListener("input", (e) => { state.betStake = e.target.value; });
    $("#betOdds")?.addEventListener("input", (e) => { state.betOdds = e.target.value; });
    $("#addSlip")?.addEventListener("click", createSelection);
    $("#placeBet")?.addEventListener("click", createBet);
    main.querySelectorAll("[data-settle]").forEach((btn) => {
      btn.addEventListener("click", () => settle(btn.dataset.settle, btn.dataset.st));
    });
    main.querySelectorAll("[data-delbet]").forEach((btn) => {
      btn.addEventListener("click", () => deleteBet(btn.dataset.delbet));
    });
    main.querySelectorAll("[data-rmsel]").forEach((btn) => {
      btn.addEventListener("click", () => removeBetSelection(btn.dataset.rmsel, btn.dataset.sel));
    });
    document.getElementById("rankSort")?.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-rsort]");
      if (!btn) return;
      state.rankSort = btn.dataset.rsort;
      render();
    });
    document.getElementById("togVibrate")?.addEventListener("click", () => {
      const next = !getSettings().vibrateGoals;
      setSetting("vibrateGoals", next);
      if (next && navigator.vibrate) navigator.vibrate(25);
      render();
    });
  }

  const FOTMOB_LEAGUES = {
    "eng.1": 47, "esp.1": 87, "ita.1": 55, "ger.1": 54, "fra.1": 53,
    "ksa.1": 536, "ned.1": 57, "por.1": 61, "chn.1": 120, "usa.1": 130, "tur.1": 71, "bra.1": 268
  };

  async function enrichAssistsFotmob(matches) {
    const need = matches.filter((m) => (m.isLive || m.isDone) && (m.scorers || []).some((s) => !s.assist));
    if (!need.length) return;
    const byLeague = {};
    need.forEach((m) => {
      const id = FOTMOB_LEAGUES[m.leagueId];
      if (!id) return;
      (byLeague[id] ||= []).push(m);
    });
    for (const lid of Object.keys(byLeague)) {
      let league;
      try { league = await fetchJSON("https://www.fotmob.com/api/data/leagues?id=" + lid); }
      catch { continue; }
      const all = (((league.fixtures || {}).allMatches) || []);
      for (const m of byLeague[lid]) {
        const day = (m.date || "").slice(0, 10);
        const hs = String(m.home.score), as = String(m.away.score);
        const scoreA = hs + " - " + as;
        const scoreB = as + " - " + hs;
        const dated = all.filter((fx) => {
          const utc = ((fx.status || {}).utcTime || "").slice(0, 10);
          return !day || !utc || day === utc;
        });
        let hit = dated.find((fx) => {
          const home = (fx.home || {}).name || "";
          const away = (fx.away || {}).name || "";
          return (namesMatch(home, m.home.name) && namesMatch(away, m.away.name))
              || (namesMatch(home, m.away.name) && namesMatch(away, m.home.name));
        });
        if (!hit) {
          hit = dated.find((fx) => {
            const sc = ((fx.status || {}).scoreStr || "").replace(/\s+/g, " ").trim();
            return sc === scoreA || sc === scoreB;
          });
        }
        if (!hit) {
          hit = dated.find((fx) => {
            const blob = ((fx.home || {}).name + " " + (fx.away || {}).name).toLowerCase();
            return blob.includes(normName(m.home.name).split(" ").pop())
                && blob.includes(normName(m.away.name).split(" ").pop());
          });
        }
        if (!hit || !hit.id) continue;
        let det;
        try { det = await fetchJSON("https://www.fotmob.com/api/data/matchDetails?matchId=" + hit.id); }
        catch { continue; }
        const evs = ((det.header || {}).events) || {};
        const goals = [];
        Object.values(evs.homeTeamGoals || {}).forEach((arr) => (arr || []).forEach((g) => goals.push(g)));
        Object.values(evs.awayTeamGoals || {}).forEach((arr) => (arr || []).forEach((g) => goals.push(g)));
        m.scorers.forEach((s) => {
          if (s.assist) return;
          const min = parseInt(String(s.minute).replace(/\D/g, ""), 10);
          const g = goals.find((x) => {
            const nm = x.fullName || x.nameStr || (x.player && x.player.name) || "";
            const tm = Number(x.time);
            return namesMatch(nm, s.scorer) && (!min || tm === min || Math.abs(tm - min) <= 1);
          }) || goals.find((x) => {
            const tm = Number(x.time);
            return min && (tm === min || Math.abs(tm - min) <= 1);
          });
          if (!g) return;
          let an = g.assistInput || "";
          if (!an && g.assistStr) {
            const mm = String(g.assistStr).match(/assist by\s+(.+)/i);
            an = mm ? mm[1].trim() : "";
          }
          if (an) {
            s.assist = an;
            s.assistId = String(g.assistPlayerId || "");
          }
        });
      }
    }
  }

  document.querySelectorAll("nav.tabs button").forEach((btn) => {
    btn.addEventListener("click", () => {
      state.tab = btn.dataset.tab;
      document.querySelectorAll("nav.tabs button").forEach((b) => b.classList.toggle("on", b === btn));
      render();
      if (state.tab === "rank") refreshAllStats();
      if (state.tab === "matches") loadMatches();
      if (state.tab === "bets") {
        autoSettleBets(state.matches);
        if (!state.matches.length) loadMatches({ silent: true });
      }
      if ((state.tab === "analyse" || state.tab === "favs") && !state.matches.length) loadMatches({ silent: true });
    });
  });


  document.getElementById("confirmNo")?.addEventListener("click", hideConfirm);
  document.getElementById("confirmYes")?.addEventListener("click", confirmRemoveFav);
  document.getElementById("confirmBg")?.addEventListener("click", (e) => {
    if (e.target.id === "confirmBg") hideConfirm();
  });

  setTimeout(() => {
    const sp = document.getElementById("splash");
    if (sp) sp.classList.add("through");
  }, 2500);
  setTimeout(() => {
    const sp = document.getElementById("splash");
    if (sp) sp.remove();
  }, 2900);

  loadMatches();
  refreshAllStats();
  setInterval(() => {
    if (state.tab === "matches") loadMatches({ silent: true });
  }, 60000);
})();
