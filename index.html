<style>
:root {
  --bg: #050505;
  --bg2: #0c0c0c;
  --card: #111111;
  --card2: #161616;
  --line: #222;
  --text: #f4f4f4;
  --muted: #8a8a8a;
  --dim: #5c5c5c;
  --live: #e11d2e;
  --ok: #2fbf71;
  --warn: #c9a227;
  --bad: #d14b4b;
  --safe: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #000; color: var(--text); }
body {
  font-family: "Inter", "SF Pro Text", system-ui, -apple-system, sans-serif;
  overflow: hidden;
}
#app {
  max-width: 430px;
  margin: 0 auto;
  height: 100%;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  position: relative;
  border-left: 1px solid #111;
  border-right: 1px solid #111;
}
header.appbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 16px 10px;
  border-bottom: 1px solid var(--line);
  background: #000;
  flex-shrink: 0;
}
.splash {
  position: absolute; inset: 0;
  background: #000;
  z-index: 80;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  overflow: hidden;
}
.splash.through {
  background: transparent;
  pointer-events: none;
}
.splash img {
  width: 96px; height: 96px;
  border-radius: 20px;
  background: #000;
  border: 1px solid #222;
  animation: splashPulse 2.5s ease-in-out both;
  transform-origin: center center;
}
.splash.through img {
  animation: splashThrough 0.3s cubic-bezier(.2,.7,.2,1) forwards;
  border-color: transparent;
}
.splash strong {
  letter-spacing: 0.28em;
  font-size: 14px;
  color: #f4f4f4;
  animation: splashIn 0.5s ease both;
}
.splash.through strong,
.splash.hide-title strong { opacity: 0; transition: opacity .4s ease; }
@keyframes splashIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}
@keyframes splashPulse {
  0% { transform: scale(.82); opacity: 0; }
  18% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.06); }
  100% { transform: scale(1); }
}
@keyframes splashThrough {
  0% { transform: scale(1); opacity: 1; filter: blur(0); }
  100% { transform: scale(18); opacity: 0; filter: blur(2px); }
}
.logo {
  width: 34px; height: 34px;
  border-radius: 8px;
  background: #000;
  border: 1px solid #2a2a2a;
  object-fit: cover;
}
.brand { display: flex; flex-direction: column; }
.brand strong { font-size: 16px; letter-spacing: 0.18em; font-weight: 700; }
.brand span { font-size: 10px; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; }
.header-meta { margin-left: auto; font-size: 11px; color: var(--muted); text-align: right; }

main {
  flex: 1;
  overflow: auto;
  padding: 12px 14px 18px;
  padding-bottom: calc(86px + var(--safe));
}
.tab { display: none; }
.tab.active { display: block; }

.row { display: flex; align-items: center; gap: 8px; }
.space { justify-content: space-between; }

h2.sec {
  font-size: 12px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 600;
  margin: 16px 2px 8px;
}
h2.sec:first-child { margin-top: 4px; }

.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto;
  border: 1px solid #2a2a2a;
  background: #0e0e0e;

  function leagueMark(id, fallback) {
    if (!getSettings().flagsLeagues) return fallback || "";
    if (id === "fifa.friendly") return "⚽";
    if (COMP_LOGOS[id]) return `<img class="lg-ico" alt="" src="${COMP_LOGOS[id]}">`;
    return leagueFlag(id) || fallback || "";
  }
  function leagueLabel(l) {
    return leagueMark(l.id, l.short || l.name || "");
  }
  function matchLeagueLabel(m) {
    return leagueMark(m.leagueId, m.league || "");
  }

  function parseMatch(event, league) {
    const comp = (event.competitions || [])[0] || {};
    const status = (comp.status || event.status || {}).type || {};
    const clock = (comp.status || event.status || {}).displayClock || "";
    const competitors = comp.competitors || [];
    const home = competitors.find((c) => c.homeAway === "home") || competitors[1] || {};
    const away = competitors.find((c) => c.homeAway === "away") || competitors[0] || {};
    const stateName = status.state || "";
    const statusBlob = [status.name, status.description, status.detail, status.shortDetail].filter(Boolean).join(" ");
    const isDone = !!(status.completed || stateName === "post" || /STATUS_FULL_TIME|FULL[ _-]?TIME|\bFT\b/i.test(statusBlob));
    const isHT = !isDone && /STATUS_HALFTIME|\bHALFTIME\b|\bHALF[ -]?TIME\b|\bMI[- ]TEMPS\b|\bPAUSE\b/.test(statusBlob)
      && !/\b(1st|2nd|FIRST|SECOND)\s+HALF\b/i.test(statusBlob);
    const isLive = !isDone && (isHT || stateName === "in" || /LIVE|IN_PLAY/i.test(status.name || ""));
    const details = comp.details || [];
    const scorers = [];
    details.forEach((d) => {
      const text = (d.type && d.type.text) || "";
      const athletes = d.athletesInvolved || [];
      if (d.scoringPlay || /goal/i.test(text)) {
        const scorer = athletes[0];
        const assist = athletes[1];
        scorers.push({
          minute: (d.clock && d.clock.displayValue) || "",
          kind: d.ownGoal ? "csc" : d.penaltyKick ? "pen" : "but",
          scorer: scorer ? scorer.displayName : "?",
          scorerId: scorer ? String(scorer.id) : "",
          assist: assist ? assist.displayName : "",
          assistId: assist ? String(assist.id) : "",
          teamId: (d.team && d.team.id) || "",
        });
      } else if (/assist/i.test(text) && athletes[0]) {
        const last = scorers[scorers.length - 1];
        if (last && !last.assist) {
          last.assist = athletes[0].displayName;
          last.assistId = String(athletes[0].id);
        }
      }
    });
    return {
      id: event.id,
      leagueId: league.id,
      league: league.name,
      date: event.date,
      isLive,
      isHT,
      isDone,
      clock: isDone ? "FIN" : isHT ? "MT" : (isLive ? clock : kickoff(event.date)),
      home: {
        id: String((home.team || {}).id || ""),
        name: (home.team || {}).shortDisplayName || (home.team || {}).displayName || "?",
        full: (home.team || {}).displayName || (home.team || {}).shortDisplayName || "",
        logo: (home.team || {}).logo,
        score: home.score || "0",
        form: home.form || "",
        record: ((home.records || [])[0] || {}).summary || "",
      },
      away: {
        id: String((away.team || {}).id || ""),
        name: (away.team || {}).shortDisplayName || (away.team || {}).displayName || "?",
        full: (away.team || {}).displayName || (away.team || {}).shortDisplayName || "",
        logo: (away.team || {}).logo,
        score: away.score || "0",
        form: away.form || "",
        record: ((away.records || [])[0] || {}).summary || "",
      },
      scorers,
    };
  }

  function assistKey(m, s) {

  function assistStore() { return loadJson(LS_ASSIST, {}); }
  function applyAssistCache(matches) {

        if (s.assist) {
          cache[assistKey(m, s)] = { assist: s.assist, assistId: s.assistId || "" };

  async function loadMatches(opts = {}) {
    const silent = !!opts.silent;
    if (!silent) {
      state.loading = true;
      render();
    }
    const date = ymd(state.date);
    const pool = activeLeagues();
    const list = state.league === "all" ? pool : pool.filter((l) => l.id === state.league);
    const results = await Promise.allSettled(
      list.map((l) => fetchJSON(`https://site.web.api.espn.com/apis/site/v2/sports/soccer/${l.id}/scoreboard?dates=${date}`).then((d) => ({ l, d })))
    );
    const matches = [];
    results.forEach((r) => {
      if (r.status !== "fulfilled") return;
      const { l, d } = r.value;
      (d.events || []).forEach((ev) => matches.push(parseMatch(ev, l)));
    });
    matches.sort((a, b) => {
      if (a.isLive !== b.isLive) return a.isLive ? -1 : 1;
      if (a.isDone !== b.isDone) return a.isDone ? 1 : -1;
      return new Date(a.date) - new Date(b.date);
    });
    applyAssistCache(matches);
    detectGoals(matches);
    settleTickets(matches);
    applyLineupCache(matches);
    state.matches = matches;
    state.loading = false;
    keepScroll(() => render());
    await enrichLineups(matches);
    await enrichAssists(matches);
    await enrichAssistsFotmob(matches);
    saveAssists(matches);
    trackDecisive(matches);
    autoSettleBets(matches);
    keepScroll(() => render());
  }

  function applyLineupCache(matches) {

  function parseMatchEvents(d, m) {
    const homeId = String((m.home && m.home.id) || "");
    const awayId = String((m.away && m.away.id) || "");
    const sideOf = (teamId) => {
      const t = String(teamId || "");
      if (t && t === homeId) return "home";
      if (t && t === awayId) return "away";
      return "";
    };
    const minNum = (c) => {
      const n = parseInt(String(c || "").replace(/\D/g, ""), 10);
      return Number.isFinite(n) ? n : 999;
    };
    const list = [];
    (m.scorers || []).forEach((s) => {
      list.push({
        kind: s.kind === "csc" ? "og" : "goal",
        minute: s.minute || "",
        side: scorerSide(m, s),
        name: s.scorer || "",
        id: s.scorerId || "",
        assist: s.assist || "",
        assistId: s.assistId || "",
        pen: s.kind === "pen",
      });
    });
    (d.keyEvents || []).forEach((e) => {
      const type = String((e.type || {}).type || "");
      const tlabel = String((e.type || {}).text || "");
      const blob = (type + " " + tlabel + " " + (e.text || "")).toLowerCase();
      const clock = (e.clock && e.clock.displayValue) || "";
      const side = sideOf((e.team || {}).id);
      const parts = e.participants || [];
      if (type === "substitution" || /substitution/.test(blob)) {
        const inn = (parts[0] && parts[0].athlete) || {};
        const out = (parts[1] && parts[1].athlete) || {};
        list.push({
          kind: "sub",
          minute: clock,
          side,
          inName: inn.displayName || "",
          inId: String(inn.id || ""),
          outName: out.displayName || "",
          outId: String(out.id || ""),
        });
        return;
      }
      if (/red-card|red card/.test(blob) && !/yellow/.test(type)) {
        const p = (parts[0] && parts[0].athlete) || {};
        list.push({ kind: "red", minute: clock, side, name: p.displayName || "", id: String(p.id || "") });
        return;
      }
      if (/penalty-missed|missed penalty|penalty miss|penalt(y|i) rat/.test(blob)) {
        const p = (parts[0] && parts[0].athlete) || {};
        list.push({ kind: "pen_miss", minute: clock, side, name: p.displayName || "", id: String(p.id || "") });
      }
    });
    list.sort((a, b) => minNum(a.minute) - minNum(b.minute));
    return list;
  }
  function eventLine(ev, matchId) {
    const min = `<span class="min">${ev.minute || ""}</span>`;
    if (ev.kind === "goal" || ev.kind === "og") {
      const extra = ev.pen ? " (P)" : ev.kind === "og" ? " (CSC)" : "";
      const sc = markFav(ev.name, ev.id, matchId);
      const as = ev.assist ? ` <span class="assist">(${markFav(ev.assist, ev.assistId, matchId)})</span>` : "";
      return `<div class="ev"><span class="ico">⚽</span>${min}<span class="evname"><b>${sc}</b>${extra}${as}</span></div>`;
    }
    if (ev.kind === "sub") {
      const inn = markFav(ev.inName, ev.inId, matchId);
      const out = markFav(ev.outName, ev.outId, matchId);
      return `<div class="ev sub"><span class="ico">🔄</span>${min}<span class="evname">${inn} <span class="pmeta">← ${out}</span></span></div>`;
    }
    if (ev.kind === "red") {
      return `<div class="ev red"><span class="ico">🟥</span>${min}<span class="evname"><b>${markFav(ev.name, ev.id, matchId)}</b></span></div>`;
    }
    if (ev.kind === "pen_miss") {
      return `<div class="ev pen-miss"><span class="ico">❌</span>${min}<span class="evname"><b>${markFav(ev.name, ev.id, matchId)}</b> <span class="pmeta">pen. raté</span></span></div>`;
    }
    return "";
  }
  async function loadMatchDetail(m) {

  async function enrichLineups(matches) {

  function starterNote(m) {
    if (m.isLive || m.isDone || m.isHT) return "";
    if (!m.starters || !m.starters.length) return "";
    const mine = favs();
    const hits = [];
    const seen = new Set();
    m.starters.forEach((s) => {
      const hit = mine.find((p) => String(p.id) === String(s.id) || (p.name && s.name && p.name.toLowerCase() === s.name.toLowerCase()));
      if (hit && !seen.has(String(hit.id))) {
        seen.add(String(hit.id));
        hits.push(hit.name);
      }
    });
    if (!hits.length) return "";
    if (hits.length === 1) return hits[0] + " est titulaire";
    if (hits.length === 2) return hits[0] + " et " + hits[1] + " sont titulaires";
    return hits.slice(0, -1).join(", ") + " et " + hits[hits.length - 1] + " sont titulaires";
  }

  function parseAssistedBy(text) {
    const m = String(text || "").match(/Assisted by\s+([A-Za-zÀ-ÿ'.\- ]+?)(?:\s+with\b|[.]|$)/i);
    return m ? m[1].trim() : "";
  }

  async function enrichAssists(matches) {
    const need = matches.filter((m) => (m.scorers || []).some((s) => !s.assist) && (m.isLive || m.isDone));
    if (!need.length) return;
    const results = await Promise.allSettled(need.map(async (m) => {
      const data = await fetchJSON(`https://site.web.api.espn.com/apis/site/v2/sports/soccer/${m.leagueId}/summary?event=${m.id}`);
      const events = data.keyEvents || [];
      const goals = events.filter((ev) => ev.scoringPlay);
      m.scorers.forEach((s) => {
        if (s.assist) return;
        const hit = goals.find((ev) => {
          const clock = (ev.clock && ev.clock.displayValue) || "";
          return clock === s.minute;
        }) || goals.find((ev) => {
          const names = (ev.participants || []).map((p) => (p.athlete || {}).displayName);
          return names[0] === s.scorer;
        });
        if (!hit) return;
        const parts = hit.participants || [];
        if (parts[1] && parts[1].athlete) {
          s.assist = parts[1].athlete.displayName;
          s.assistId = String(parts[1].athlete.id || "");
        } else {
          const name = parseAssistedBy(hit.text);
          if (name) s.assist = name;
        }
      });
    }));
    const still = matches.filter((m) => (m.scorers || []).some((s) => !s.assist) && (m.isLive || m.isDone));
    if (still.length) await enrichAssistsScore(still);
    return results;
  }

  const SCORE_LEAGUES = {
    "eng.1": "epl", "esp.1": "liga", "ita.1": "seri", "ger.1": "bund",
    "fra.1": "fran", "ksa.1": "saudipl", "ned.1": "ned", "por.1": "ptpl",
    "chn.1": "chsl", "usa.1": "mls"

  function normName(s) {
    return String(s || "")
      .toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/\b(al|fc|cf|sc|ac|as|ss|ud|cd|rc|afc|the)\b/g, " ")
      .replace(/[^a-z0-9]+/g, " ")
      .trim();
  }

  function namesMatch(a, b) {
    const na = normName(a), nb = normName(b);
    if (!na || !nb) return false;
    if (na === nb) return true;
    if (na.includes(nb) || nb.includes(na)) return true;
    const ta = new Set(na.split(" ").filter((w) => w.length > 2));
    const tb = nb.split(" ").filter((w) => w.length > 2);
    return tb.filter((w) => ta.has(w)).length >= 1;
  }

  async function enrichAssistsScore(matches) {
    const bySlug = {};
    matches.forEach((m) => {
      const slug = SCORE_LEAGUES[m.leagueId];
      if (!slug) return;
      (bySlug[slug] ||= []).push(m);
    });
    for (const slug of Object.keys(bySlug)) {
      let events;
      try { events = await fetchJSON("https://api.thescore.com/" + slug + "/events"); }
      catch { continue; }
      if (!Array.isArray(events)) continue;
      for (const m of bySlug[slug]) {
        const day = (m.date || "").slice(0, 10);
        const cand = events.filter((ev) => {
          const gd = ev.game_date || "";
          if (day && !gd.includes(day) && !gd.includes(new Date(m.date).toUTCString().slice(5, 16))) {
            const d = new Date(gd);
            const md = new Date(m.date);
            if (isNaN(d) || isNaN(md)) return false;
            if (d.toISOString().slice(0,10) !== md.toISOString().slice(0,10)) return false;
          }
          const home = (ev.home_team || {}).name || (ev.home_team || {}).full_name || "";
          const away = (ev.away_team || {}).name || (ev.away_team || {}).full_name || "";
          return (namesMatch(home, m.home.name) && namesMatch(away, m.away.name))
              || (namesMatch(home, m.away.name) && namesMatch(away, m.home.name));
        });
        const ev = cand[0];
        if (!ev) continue;
        let pbp;
        try { pbp = await fetchJSON("https://api.thescore.com/" + slug + "/events/" + ev.id + "/play_by_play_records"); }
        catch { continue; }
        if (!Array.isArray(pbp)) continue;
        const goals = pbp.filter((r) => (r.category || "") === "Goal");
        m.scorers.forEach((s) => {
          if (s.assist) return;
          const min = parseInt(String(s.minute).replace(/\D/g, ""), 10);
          const hit = goals.find((g) => {
            const gn = (g.player && (g.player.full_name || g.player.name)) || "";
            return namesMatch(gn, s.scorer) && (!min || g.minutes === min || Math.abs((g.minutes || 0) - min) <= 1);
          }) || goals.find((g) => namesMatch((g.player && (g.player.full_name || g.player.name)) || "", s.scorer));
          if (!hit) return;
          const as = hit.assist;
          if (as && (as.full_name || as.name)) {
            s.assist = as.full_name || as.name;
            s.assistId = String(as.id || "");
          } else {
            const name = parseAssistedBy(hit.description);
            if (name) s.assist = name;
          }
        });
      }
    }
  }

  function trackDecisive(matches) {
    const f = favs();
    if (!f.length) return;
    const ids = new Set(f.map((p) => String(p.id)));

    matches.forEach((m) => {
      m.scorers.forEach((s) => {
        [
          s.scorerId && { pid: s.scorerId, type: "but", name: s.scorer },
          s.assistId && { pid: s.assistId, type: "passe", name: s.assist },
        ].filter(Boolean).forEach((hit) => {
          if (!ids.has(hit.pid)) return;
          const key = `${m.id}-${hit.pid}-${s.minute}-${hit.type}`;
          if (log.some((x) => x.key === key)) return;
          log.unshift({
            key,
            playerId: hit.pid,

            type: hit.type,
            minute: s.minute,
            match: `${m.home.name} ${m.home.score}-${m.away.score} ${m.away.name}`,
            league: m.league,
            date: m.date,

      });

      else if (status === "lost") { gain = 0; profit = -b.stake; }
      else { gain = b.stake; profit = 0; }
      return { ...b, status, gain, profit, settledAt: Date.now() };
    });
    saveJson(LS_BETS, list);
    render();
  }
  function autoSettleBets(matches) {
    const list = bets();
    let changed = false;
    const next = list.map((b) => {
      if (b.status && b.status !== "open") return b;
      const sels = b.selections || [];
      if (!sels.length) return b;
      const results = sels.map((s) => evalSelection(s, matches));
      if (results.some((r) => r === "lost")) {
        changed = true;
        return { ...b, status: "lost", gain: 0, profit: -b.stake, settledAt: Date.now() };
      }
      if (results.every((r) => r === "won")) {
        const gain = +(b.stake * b.odds).toFixed(2);
        changed = true;
        return { ...b, status: "won", gain, profit: +(gain - b.stake).toFixed(2), settledAt: Date.now() };
      }
      return b;
    });
    if (changed) saveJson(LS_BETS, next);
  }
  function betSummary() {
    const list = bets();
    const settled = list.filter((b) => b.status === "won" || b.status === "lost");
    const mise = settled.reduce((s, b) => s + Number(b.stake || 0), 0);
    const gains = settled.reduce((s, b) => s + (b.status === "won" ? Number(b.stake) * Number(b.odds) : 0), 0);
    return { mise, gains, benef: gains - mise };
  }

  function matchFavs() { return loadJson(LS_MATCH_FAV, []); }
  function isMatchFav(id) { return matchFavs().includes(String(id)); }
  function toggleMatchFav(id) {
    id = String(id);
    let list = matchFavs();
    if (list.includes(id)) list = list.filter((x) => x !== id);
    else list.unshift(id);
    saveJson(LS_MATCH_FAV, list);
    keepScroll(() => render());
  }
  function notifyFavDecisive(m) {
    if (!getSettings().notifFavGoals) return;
    const last = (m.scorers || [])[(m.scorers || []).length - 1];
    if (!last || last.kind === "csc") return;
    const scorerFav = isFavPlayer(last.scorerId, last.scorer);
    const assistFav = isFavPlayer(last.assistId, last.assist);
    if (!scorerFav && !assistFav) return;
    const role = scorerFav ? "Buteur" : "Passeur";
    const who = scorerFav
      ? (favs().find((p) => String(p.id) === String(last.scorerId) || fold(p.name) === fold(last.scorer)) || {}).name || last.scorer
      : (favs().find((p) => String(p.id) === String(last.assistId) || fold(p.name) === fold(last.assist)) || {}).name || last.assist;
    const score = m.home.name + " " + m.home.score + "–" + m.away.score + " " + m.away.name;
    const min = last.minute || m.clock || "";
    const title = who + " · " + role;
    const body = score + (min ? " · " + min : "");
    const tag = "dec-" + m.id + "-" + m.home.score + "-" + m.away.score + "-" + role;
    if (!state.notifDone) state.notifDone = {};
    if (state.notifDone[tag]) return;
    state.notifDone[tag] = Date.now();
    toast(title + " · " + body);
    if (!("Notification" in window)) return;
    if (Notification.permission === "granted") {
      try { new Notification(title, { body, tag }); } catch (e) {}
    }
  }
  async function enableFavNotifs() {
    if (!("Notification" in window)) { toast("Notifs indisponibles ici"); return false; }
    if (Notification.permission === "granted") return true;
    try {
      const p = await Notification.requestPermission();
      return p === "granted";
    } catch { return false; }
  }

  function unlockSpeech() {
    try {
      if (!window.speechSynthesis) return;
      // charge les voix + débloque la synthèse (geste utilisateur)
      window.speechSynthesis.getVoices();
      const warm = new SpeechSynthesisUtterance(".");
      warm.volume = 0;
      warm.rate = 2;
      window.speechSynthesis.speak(warm);
      window.speechSynthesis.cancel();
    } catch (e) {}
  }
  function speakGoal(playerName, teamName) {
    if (!getSettings().voiceGoals) return;
    const n = String(playerName || "").trim();
    if (!n) return;
    if (!window.speechSynthesis) {
      toast("Voix non supportée sur cet appareil");
      return;
    }
    const team = String(teamName || "").trim();
    const phrase = team ? ("But pour " + team + " de " + n) : ("But de " + n);
    const speakNow = () => {
      try {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(phrase);
        u.lang = "fr-FR";
        u.rate = 1;
        u.pitch = 1;
        u.volume = 1;
        const voices = window.speechSynthesis.getVoices() || [];
        const fr =
          voices.find((v) => /^fr(-|_)FR/i.test(v.lang)) ||
          voices.find((v) => /^fr/i.test(v.lang)) ||
          null;
        if (fr) u.voice = fr;
        u.onerror = () => {
          toast(phrase);
        };
        window.speechSynthesis.speak(u);
      } catch (e) {
        toast(phrase);
      }
    };
    const voices = window.speechSynthesis.getVoices() || [];
    if (!voices.length) {
      const once = () => {
        window.speechSynthesis.removeEventListener("voiceschanged", once);
        speakNow();
      };
      window.speechSynthesis.addEventListener("voiceschanged", once);
      setTimeout(speakNow, 400);
    } else {
      speakNow();
    }
  }
  function playGoalSound(onEnded) {
    const done = () => {
      try { if (typeof onEnded === "function") onEnded(); } catch (e) {}
    };
    if (!getSettings().soundGoals) {
      done();
      return;
    }
    try {
      if (playGoalSound._audio) {
        try { playGoalSound._audio.pause(); } catch (e) {}
      }
      const a = new Audio(GOAL_SOUND_SRC);
      playGoalSound._audio = a;
      const vol = Math.max(0, Math.min(1, (Number(getSettings().soundVol) || 70) / 100));
      a.volume = vol;
      let finished = false;
      const finish = () => {
        if (finished) return;
        finished = true;
        done();
      };
      a.onended = finish;
      a.onerror = finish;
      // secours si ended ne part pas (~durée du mp3 + marge)
      clearTimeout(playGoalSound._t);
      playGoalSound._t = setTimeout(finish, 2200);
      const p = a.play();
      if (p && p.catch) p.catch(() => finish());
    } catch (e) {
      done();
    }
  }
  function announceGoal(playerName, teamName) {
    if (!playerName) return;
    if (getSettings().soundGoals) {

      if (prev == null || prev === key) return;
      const [ph, pa] = prev.split("-").map((n) => Number(n) || 0);
      const nh = Number(m.home.score) || 0;
      const na = Number(m.away.score) || 0;

        state.goalScorer[m.id] = last ? (last.scorer || "") : "";

  function matchCard(m, big) {

  async function loadHotPlayers() {
    if (state.hotPlayers && state.hotPlayers.length) return;
    const slugs = activeLeagues().filter((l) => !["uefa.champions","uefa.europa","uefa.europa.conf","fifa.world","uefa.euro","uefa.nations","conmebol.america","caf.nations","fifa.friendly","concacaf.champions","concacaf.nations.league","uefa.euro_u21_qual"].includes(l.id));
    const bag = {};
    await Promise.allSettled(slugs.map(async (l) => {
      const d = await fetchJSON("https://site.web.api.espn.com/apis/site/v2/sports/soccer/" + l.id + "/statistics");
      (d.stats || []).forEach((cat) => {
        const kind = /assist/i.test(cat.name || "") ? "a" : /goal/i.test(cat.name || "") ? "g" : "";
        if (!kind) return;
        (cat.leaders || []).slice(0, 25).forEach((row) => {
          const ath = row.athlete || {};
          const id = String(ath.id || "");
          if (!id) return;
          const sd = row.shortDisplayValue || "";
          const g = Number((sd.match(/G:\s*(\d+)/) || [])[1]);
          const a = Number((sd.match(/A:\s*(\d+)/) || [])[1]);
          const cur = bag[id] || { id, name: ath.displayName || "", team: (ath.team && ath.team.displayName) || "", league: l.name, pos: "", g: 0, a: 0 };
          if (Number.isFinite(g)) cur.g = Math.max(cur.g, g);
          if (Number.isFinite(a)) cur.a = Math.max(cur.a, a);
          if (kind === "g" && !Number.isFinite(g)) cur.g = Math.max(cur.g, Number(row.value) || 0);
          if (kind === "a" && !Number.isFinite(a)) cur.a = Math.max(cur.a, Number(row.value) || 0);
          bag[id] = cur;
        });
      });
    }));
    const list = Object.values(bag).map((p) => {
      p.ga = (p.g || 0) + (p.a || 0);
      p.league = (p.ga ? (p.ga + " G/A · ") : "") + (p.league || "");
      return p;
    }).filter((p) => p.ga > 0).sort((a, b) => b.ga - a.ga);
    state.hotPlayers = list;
    if (state.tab === "favs" && !state.q) render();
  }

  function fact(n) { let r = 1; for (let i = 2; i <= n; i++) r *= i; return r; }
  function poisson(k, lam) { return Math.exp(-lam) * Math.pow(lam, k) / fact(k); }
  function teamPower(form, record) {
    let ppg = 1.2;
    const rec = String(record || "").match(/(\d+)\s*-\s*(\d+)\s*-\s*(\d+)/);
    if (rec) {
      const w = +rec[1], d = +rec[2], l = +rec[3];
      const g = w + d + l;
      if (g) ppg = (3 * w + d) / g;
    }
    const f = String(form || "").toUpperCase();
    let fp = 0, n = 0;
    for (const ch of f) {
      if (ch === "W") { fp += 3; n++; }
      else if (ch === "D") { fp += 1; n++; }
      else if (ch === "L") { n++; }
    }
    const formPpg = n ? fp / n : ppg;
    return Math.max(0.25, Math.min(2.9, 0.58 * ppg + 0.42 * formPpg));
  }
  function analyzeMatch(m) {
    const ph = teamPower(m.home.form, m.home.record);
    const pa = teamPower(m.away.form, m.away.record);
    const diff = ph - pa;
    let lh = 1.18 + diff * 0.62 + 0.22;
    let la = 1.02 - diff * 0.58;
    lh = Math.max(0.45, Math.min(2.7, lh));
    la = Math.max(0.4, Math.min(2.5, la));
    const grid = [];
    let p1 = 0, pN = 0, p2 = 0, best = { h: 1, a: 1, p: 0 };
    for (let i = 0; i <= 5; i++) {
      for (let j = 0; j <= 5; j++) {
        const p = poisson(i, lh) * poisson(j, la);
        grid.push({ i, j, p });
        if (i > j) p1 += p; else if (i === j) pN += p; else p2 += p;
        if (p > best.p) best = { h: i, a: j, p };
      }
    }
    const tot = p1 + pN + p2 || 1;
    return {
      p1: Math.round(1000 * p1 / tot) / 10,
      pN: Math.round(1000 * pN / tot) / 10,
      p2: Math.round(1000 * p2 / tot) / 10,
      score: best.h + "–" + best.a,
      scorePct: Math.round(1000 * best.p / tot) / 10,
      xg: (lh + la).toFixed(1),
    };
  }
  function teamWatchList(team) {

      if (seen.has(id)) return;
      seen.add(id);
      const st = stats[p.id] || {};
      pool.push({ id: p.id, name: p.name, team: p.team || "", ga: Number(st.ga) || 0 });
    };
    favs().forEach(add);
    (CATALOG || []).forEach(add);
    const hit = pool.filter((p) => names.some((n) => {
      const a = String(n || "").toLowerCase();
      const b = String(p.team || "").toLowerCase();
      return a && b && (a === b || a.includes(b) || b.includes(a));

    hit.sort((a, b) => b.ga - a.ga);
    return hit;
  }

      const names = [team.name, team.full].map((x) => String(x || "").toLowerCase()).filter(Boolean);
      return a && names.some((n) => n === a || n.includes(a) || a.includes(n));
    };
    const pick = (team) => mine.filter((p) => matchTeam(p, team)).sort((a, b) => (Number((stats[b.id] || {}).ga) || 0) - (Number((stats[a.id] || {}).ga) || 0));
    const h = pick(m.home);

    const out = [];

  function playerHit(m, pid, name, goal, assist) {
    const pn = fold(name || "");
    return (m.scorers || []).some((s) => {
      const g = goal && ((pid && String(s.scorerId) === String(pid)) || (pn && fold(s.scorer || "").includes(pn)));

  function evalTicket(tk, m) {
    if (!m) return "open";
    const mk = tk.market || tk.pick || "";
    const hs = Number(m.home.score) || 0;
    const as = Number(m.away.score) || 0;
    const tot = hs + as;
    const done = !!m.isDone;
    const win = (ok) => ok ? "won" : (done ? "lost" : "open");
    if (mk === "1") return win(done && hs > as);
    if (mk === "N") return win(done && hs === as);
    if (mk === "2") return win(done && as > hs);
    if (mk === "1N") return win(done && hs >= as);
    if (mk === "N2") return win(done && as >= hs);
    if (mk === "over15") return tot >= 2 ? "won" : (done ? "lost" : "open");
    if (mk === "over25") return tot >= 3 ? "won" : (done ? "lost" : "open");
    if (mk === "buteur") return win(playerHit(m, tk.playerId, tk.playerName, true, false));
    if (mk === "passeur") return win(playerHit(m, tk.playerId, tk.playerName, false, true));

  const FOTMOB_LEAGUES = {
    "eng.1": 47, "esp.1": 87, "ita.1": 55, "ger.1": 54, "fra.1": 53,
    "ksa.1": 536, "ned.1": 57, "por.1": 61, "chn.1": 120, "usa.1": 130, "tur.1": 71, "bra.1": 268
  };

  async function enrichAssistsFotmob(matches) {
    const need = matches.filter((m) => (m.isLive || m.isDone) && (m.scorers || []).some((s) => !s.assist));
    if (!need.length) return;
    const byLeague = {};
    need.forEach((m) => {
      const id = FOTMOB_LEAGUES[m.leagueId];
      if (!id) return;
      (byLeague[id] ||= []).push(m);
    });
    for (const lid of Object.keys(byLeague)) {
      let league;
      try { league = await fetchJSON("https://www.fotmob.com/api/data/leagues?id=" + lid); }
      catch { continue; }
      const all = (((league.fixtures || {}).allMatches) || []);
      for (const m of byLeague[lid]) {
        const day = (m.date || "").slice(0, 10);
        const hs = String(m.home.score), as = String(m.away.score);
        const scoreA = hs + " - " + as;
        const scoreB = as + " - " + hs;
        const dated = all.filter((fx) => {
          const utc = ((fx.status || {}).utcTime || "").slice(0, 10);
          return !day || !utc || day === utc;
        });
        let hit = dated.find((fx) => {
          const home = (fx.home || {}).name || "";
          const away = (fx.away || {}).name || "";
          return (namesMatch(home, m.home.name) && namesMatch(away, m.away.name))
              || (namesMatch(home, m.away.name) && namesMatch(away, m.home.name));
        });
        if (!hit) {
          hit = dated.find((fx) => {
            const sc = ((fx.status || {}).scoreStr || "").replace(/\s+/g, " ").trim();
            return sc === scoreA || sc === scoreB;
          });
        }
        if (!hit) {
          hit = dated.find((fx) => {
            const blob = ((fx.home || {}).name + " " + (fx.away || {}).name).toLowerCase();
            return blob.includes(normName(m.home.name).split(" ").pop())
                && blob.includes(normName(m.away.name).split(" ").pop());
          });
        }
        if (!hit || !hit.id) continue;
        let det;
        try { det = await fetchJSON("https://www.fotmob.com/api/data/matchDetails?matchId=" + hit.id); }
        catch { continue; }
        const evs = ((det.header || {}).events) || {};
        const goals = [];
        Object.values(evs.homeTeamGoals || {}).forEach((arr) => (arr || []).forEach((g) => goals.push(g)));
        Object.values(evs.awayTeamGoals || {}).forEach((arr) => (arr || []).forEach((g) => goals.push(g)));
        m.scorers.forEach((s) => {
          if (s.assist) return;
          const min = parseInt(String(s.minute).replace(/\D/g, ""), 10);
          const g = goals.find((x) => {
            const nm = x.fullName || x.nameStr || (x.player && x.player.name) || "";
            const tm = Number(x.time);
            return namesMatch(nm, s.scorer) && (!min || tm === min || Math.abs(tm - min) <= 1);
          }) || goals.find((x) => {
            const tm = Number(x.time);
            return min && (tm === min || Math.abs(tm - min) <= 1);
          });
          if (!g) return;
          let an = g.assistInput || "";
          if (!an && g.assistStr) {
            const mm = String(g.assistStr).match(/assist by\s+(.+)/i);
            an = mm ? mm[1].trim() : "";
          }
          if (an) {
            s.assist = an;
            s.assistId = String(g.assistPlayerId || "");
          }
        });
      }
    }
  }

  const TAB_ORDER = ["matches", "favs", "rank", "settings"];
  function goTab(tab) {

    state.tab = tab;

        const lid = state.tableLeague || (list[0] && list[0].id);

      }
    }
    if (tab === "matches") loadMatches();
    if (tab === "favs") {
      loadHotPlayers();
      if (!state.matches.length) loadMatches({ silent: true });
    }
  }
  document.querySelectorAll("nav.tabs button").forEach((btn) => {

  (function setupSwipe() {
    let x0 = 0, y0 = 0, tracking = false;
    main.addEventListener("touchstart", (e) => {
      if (!e.touches || !e.touches[0]) return;
      if (state.detailId || state.teamSheet || state.playerSheet) return;
      tracking = true;
      x0 = e.touches[0].clientX;
      y0 = e.touches[0].clientY;
    }, { passive: true });
    main.addEventListener("touchend", (e) => {
      if (!tracking) return;
      tracking = false;
      const tch = e.changedTouches && e.changedTouches[0];
      if (!tch) return;
      const dx = tch.clientX - x0;
      const dy = tch.clientY - y0;
      if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.4) return;
      const i = TAB_ORDER.indexOf(state.tab);
      if (i < 0) return;
      if (dx < 0 && i < TAB_ORDER.length - 1) goTab(TAB_ORDER[i + 1]);
      if (dx > 0 && i > 0) goTab(TAB_ORDER[i - 1]);
    }, { passive: true });
  })();
