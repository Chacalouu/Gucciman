<style>
:root {
  --bg: #050505;
  --bg2: #0c0c0c;
  --card: #111111;
  --card2: #161616;
  --line: #222;
  --text: #f4f4f4;
  --muted: #8a8a8a;
  --dim: #5c5c5c;
  --live: #e11d2e;
  --ok: #2fbf71;
  --warn: #c9a227;
  --bad: #d14b4b;
  --safe: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #000; color: var(--text); }
body {
  font-family: "Inter", "SF Pro Text", system-ui, -apple-system, sans-serif;
  overflow: hidden;
}
#app {
  max-width: 430px;
  margin: 0 auto;
  height: 100%;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  position: relative;
  border-left: 1px solid #111;
  border-right: 1px solid #111;
}
header.appbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 16px 10px;
  border-bottom: 1px solid var(--line);
  background: #000;
  flex-shrink: 0;
}
.splash {
  position: absolute; inset: 0;
  background: #000;
  z-index: 80;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  overflow: hidden;
}
.splash.through {
  background: transparent;
  pointer-events: none;
}
.splash img {
  width: 96px; height: 96px;
  border-radius: 20px;
  background: #000;
  border: 1px solid #222;
  animation: splashPulse 2.5s ease-in-out both;
  transform-origin: center center;
}
.splash.through img {
  animation: splashThrough 0.3s cubic-bezier(.2,.7,.2,1) forwards;
  border-color: transparent;
}
.splash strong {
  letter-spacing: 0.28em;
  font-size: 14px;
  color: #f4f4f4;
  animation: splashIn 0.5s ease both;
}
.splash.through strong,
.splash.hide-title strong { opacity: 0; transition: opacity .2s linear; }
@keyframes splashIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}
@keyframes splashPulse {
  0% { transform: scale(.82); opacity: 0; }
  18% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.06); }
  100% { transform: scale(1); }
}
@keyframes splashThrough {
  0% { transform: scale(1); opacity: 1; filter: blur(0); }
  100% { transform: scale(18); opacity: 0; filter: blur(2px); }
}
.logo {
  width: 34px; height: 34px;
  border-radius: 8px;
  background: #000;
  border: 1px solid #2a2a2a;
  object-fit: cover;
}
.brand { display: flex; flex-direction: column; }
.brand strong { font-size: 16px; letter-spacing: 0.18em; font-weight: 700; }
.brand span { font-size: 10px; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; }
.header-meta { margin-left: auto; font-size: 11px; color: var(--muted); text-align: right; }

main {
  flex: 1;
  overflow: auto;
  padding: 12px 14px 18px;
  padding-bottom: calc(86px + var(--safe));
}
.tab { display: none; }
.tab.active { display: block; }

.row { display: flex; align-items: center; gap: 8px; }
.space { justify-content: space-between; }

h2.sec {
  font-size: 12px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 600;
  margin: 16px 2px 8px;
}
h2.sec:first-child { margin-top: 4px; }

.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto;
  border: 1px solid #2a2a2a;
  background: #0e0e0e;

  function leagueFlag(id) {
    const map = {
      "eng.1": "🏴󠁧󠁢󠁥󠁮󠁧󠁿",
      "esp.1": "🇪🇸",
      "ita.1": "🇮🇹",

      "fra.1": "🇫🇷",
      "ksa.1": "🇸🇦",
      "ned.1": "🇳🇱",
      "por.1": "🇵🇹",
      "chn.1": "🇨🇳",
      "usa.1": "🇺🇸",
      "tur.1": "🇹🇷",
      "bra.1": "🇧🇷",

    };
    return map[id] || "";

  function leagueMark(id, fallback) {
    if (!getSettings().flagsLeagues) return fallback || "";
    if (id === "fifa.friendly") return "⚽";
    if (COMP_LOGOS[id]) return `<img class="lg-ico" alt="" src="${COMP_LOGOS[id]}">`;
    return leagueFlag(id) || fallback || "";
  }
  function leagueLabel(l) {
    return leagueMark(l.id, l.short || l.name || "");
  }
  function matchLeagueLabel(m) {
    return leagueMark(m.leagueId, m.league || "");
  }

  function getSettings() {
    const s = loadJson(LS_SETTINGS, {});
    return {
      vibrateGoals: s.vibrateGoals !== false,
      flagsLeagues: !!s.flagsLeagues,
      enabledLeagues: Array.isArray(s.enabledLeagues) ? s.enabledLeagues : null,
      notifFavGoals: !!s.notifFavGoals,
    };
  }
  function activeLeagues() {
    const ids = getSettings().enabledLeagues;
    if (!ids || !ids.length) return LEAGUES.slice();
    const set = new Set(ids.map(String));
    const on = LEAGUES.filter((l) => set.has(l.id));
    return on.length ? on : LEAGUES.slice();
  }
  function setSetting(key, val) {
    const s = getSettings();

  function parseMatch(event, league) {
    const comp = (event.competitions || [])[0] || {};
    const status = (comp.status || event.status || {}).type || {};
    const clock = (comp.status || event.status || {}).displayClock || "";
    const competitors = comp.competitors || [];
    const home = competitors.find((c) => c.homeAway === "home") || competitors[1] || {};
    const away = competitors.find((c) => c.homeAway === "away") || competitors[0] || {};
    const stateName = status.state || "";
    const statusBlob = [status.name, status.description, status.detail, status.shortDetail].filter(Boolean).join(" ");
    const isDone = !!(status.completed || stateName === "post" || /STATUS_FULL_TIME|FULL[ _-]?TIME|\bFT\b/i.test(statusBlob));
    const isHT = !isDone && /STATUS_HALFTIME|\bHALFTIME\b|\bHALF[ -]?TIME\b|\bMI[- ]TEMPS\b|\bPAUSE\b/.test(statusBlob)
      && !/\b(1st|2nd|FIRST|SECOND)\s+HALF\b/i.test(statusBlob);
    const isLive = !isDone && (isHT || stateName === "in" || /LIVE|IN_PLAY/i.test(status.name || ""));
    const details = comp.details || [];
    const scorers = [];
    details.forEach((d) => {
      const text = (d.type && d.type.text) || "";
      const athletes = d.athletesInvolved || [];
      if (d.scoringPlay || /goal/i.test(text)) {
        const scorer = athletes[0];
        const assist = athletes[1];
        scorers.push({
          minute: (d.clock && d.clock.displayValue) || "",
          kind: d.ownGoal ? "csc" : d.penaltyKick ? "pen" : "but",
          scorer: scorer ? scorer.displayName : "?",
          scorerId: scorer ? String(scorer.id) : "",
          assist: assist ? assist.displayName : "",
          assistId: assist ? String(assist.id) : "",
          teamId: (d.team && d.team.id) || "",
        });
      } else if (/assist/i.test(text) && athletes[0]) {
        const last = scorers[scorers.length - 1];
        if (last && !last.assist) {
          last.assist = athletes[0].displayName;
          last.assistId = String(athletes[0].id);
        }
      }
    });
    return {
      id: event.id,
      leagueId: league.id,
      league: league.name,
      date: event.date,
      isLive,
      isHT,
      isDone,
      clock: isDone ? "FIN" : isHT ? "MT" : (isLive ? clock : kickoff(event.date)),
      home: {
        id: String((home.team || {}).id || ""),
        name: (home.team || {}).shortDisplayName || (home.team || {}).displayName || "?",
        full: (home.team || {}).displayName || (home.team || {}).shortDisplayName || "",
        logo: (home.team || {}).logo,
        score: home.score || "0",
        form: home.form || "",
        record: ((home.records || [])[0] || {}).summary || "",
      },
      away: {
        id: String((away.team || {}).id || ""),
        name: (away.team || {}).shortDisplayName || (away.team || {}).displayName || "?",
        full: (away.team || {}).displayName || (away.team || {}).shortDisplayName || "",
        logo: (away.team || {}).logo,
        score: away.score || "0",
        form: away.form || "",
        record: ((away.records || [])[0] || {}).summary || "",
      },
      scorers,
    };
  }

  async function loadMatches(opts = {}) {
    const silent = !!opts.silent;
    if (!silent) {
      state.loading = true;
      render();
    }
    const date = ymd(state.date);
    const pool = activeLeagues();
    const list = state.league === "all" ? pool : pool.filter((l) => l.id === state.league);
    const results = await Promise.allSettled(
      list.map((l) => fetchJSON(`https://site.web.api.espn.com/apis/site/v2/sports/soccer/${l.id}/scoreboard?dates=${date}`).then((d) => ({ l, d })))
    );
    const matches = [];
    results.forEach((r) => {
      if (r.status !== "fulfilled") return;
      const { l, d } = r.value;
      (d.events || []).forEach((ev) => matches.push(parseMatch(ev, l)));
    });
    matches.sort((a, b) => {
      if (a.isLive !== b.isLive) return a.isLive ? -1 : 1;
      if (a.isDone !== b.isDone) return a.isDone ? 1 : -1;
      return new Date(a.date) - new Date(b.date);
    });
    applyAssistCache(matches);
    detectGoals(matches);
    applyLineupCache(matches);
    state.matches = matches;
    state.loading = false;
    keepScroll(() => render());
    await enrichLineups(matches);
    await enrichAssists(matches);

  function starterNote(m) {

  function parseAssistedBy(text) {
    const m = String(text || "").match(/Assisted by\s+([A-Za-zÀ-ÿ'.\- ]+?)(?:\s+with\b|[.]|$)/i);

  async function enrichAssists(matches) {
    const need = matches.filter((m) => (m.scorers || []).some((s) => !s.assist) && (m.isLive || m.isDone));
    if (!need.length) return;
    const results = await Promise.allSettled(need.map(async (m) => {
      const data = await fetchJSON(`https://site.web.api.espn.com/apis/site/v2/sports/soccer/${m.leagueId}/summary?event=${m.id}`);
      const events = data.keyEvents || [];
      const goals = events.filter((ev) => ev.scoringPlay);
      m.scorers.forEach((s) => {
        if (s.assist) return;
        const hit = goals.find((ev) => {
          const clock = (ev.clock && ev.clock.displayValue) || "";
          return clock === s.minute;
        }) || goals.find((ev) => {
          const names = (ev.participants || []).map((p) => (p.athlete || {}).displayName);
          return names[0] === s.scorer;
        });
        if (!hit) return;
        const parts = hit.participants || [];
        if (parts[1] && parts[1].athlete) {
          s.assist = parts[1].athlete.displayName;
          s.assistId = String(parts[1].athlete.id || "");
        } else {
          const name = parseAssistedBy(hit.text);
          if (name) s.assist = name;
        }
      });
    }));
    const still = matches.filter((m) => (m.scorers || []).some((s) => !s.assist) && (m.isLive || m.isDone));
    if (still.length) await enrichAssistsScore(still);
    return results;

  const SCORE_LEAGUES = {
    "eng.1": "epl", "esp.1": "liga", "ita.1": "seri", "ger.1": "bund",

  function normName(s) {
    return String(s || "")
      .toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/\b(al|fc|cf|sc|ac|as|ss|ud|cd|rc|afc|the)\b/g, " ")
      .replace(/[^a-z0-9]+/g, " ")
      .trim();
  }

  function namesMatch(a, b) {
    const na = normName(a), nb = normName(b);
    if (!na || !nb) return false;
    if (na === nb) return true;
    if (na.includes(nb) || nb.includes(na)) return true;
    const ta = new Set(na.split(" ").filter((w) => w.length > 2));
    const tb = nb.split(" ").filter((w) => w.length > 2);
    return tb.filter((w) => ta.has(w)).length >= 1;
  }

  async function enrichAssistsScore(matches) {
    const bySlug = {};
    matches.forEach((m) => {
      const slug = SCORE_LEAGUES[m.leagueId];
      if (!slug) return;
      (bySlug[slug] ||= []).push(m);
    });
    for (const slug of Object.keys(bySlug)) {
      let events;
      try { events = await fetchJSON("https://api.thescore.com/" + slug + "/events"); }
      catch { continue; }
      if (!Array.isArray(events)) continue;
      for (const m of bySlug[slug]) {
        const day = (m.date || "").slice(0, 10);
        const cand = events.filter((ev) => {
          const gd = ev.game_date || "";
          if (day && !gd.includes(day) && !gd.includes(new Date(m.date).toUTCString().slice(5, 16))) {
            const d = new Date(gd);
            const md = new Date(m.date);
            if (isNaN(d) || isNaN(md)) return false;
            if (d.toISOString().slice(0,10) !== md.toISOString().slice(0,10)) return false;
          }
          const home = (ev.home_team || {}).name || (ev.home_team || {}).full_name || "";
          const away = (ev.away_team || {}).name || (ev.away_team || {}).full_name || "";
          return (namesMatch(home, m.home.name) && namesMatch(away, m.away.name))
              || (namesMatch(home, m.away.name) && namesMatch(away, m.home.name));
        });
        const ev = cand[0];
        if (!ev) continue;
        let pbp;
        try { pbp = await fetchJSON("https://api.thescore.com/" + slug + "/events/" + ev.id + "/play_by_play_records"); }
        catch { continue; }
        if (!Array.isArray(pbp)) continue;
        const goals = pbp.filter((r) => (r.category || "") === "Goal");
        m.scorers.forEach((s) => {
          if (s.assist) return;
          const min = parseInt(String(s.minute).replace(/\D/g, ""), 10);
          const hit = goals.find((g) => {
            const gn = (g.player && (g.player.full_name || g.player.name)) || "";
            return namesMatch(gn, s.scorer) && (!min || g.minutes === min || Math.abs((g.minutes || 0) - min) <= 1);
          }) || goals.find((g) => namesMatch((g.player && (g.player.full_name || g.player.name)) || "", s.scorer));
          if (!hit) return;
          const as = hit.assist;
          if (as && (as.full_name || as.name)) {
            s.assist = as.full_name || as.name;
            s.assistId = String(as.id || "");
          } else {
            const name = parseAssistedBy(hit.description);
            if (name) s.assist = name;
          }
        });
      }
    }
  }

  async function searchTeamRoster(namePart, teamPart) {
    const data = await fetchJSON("https://site.web.api.espn.com/apis/search/v2?query=" + encodeURIComponent(teamPart) + "&limit=15");
    const teams = [];
    (data.results || []).forEach((block) => {
      if (String(block.type || "").toLowerCase() !== "team") return;
      (block.contents || []).forEach((c) => {
        if (c.sport && c.sport !== "soccer") return;
        const uid = String(c.uid || "");
        const tid = uid.includes("t:") ? uid.split("t:").pop() : "";
        if (!tid) return;
        const league = knownLeagueName(c.subtitle || c.description || "") || knownLeagueName(teamPart);
        const slug = (LEAGUES.find((l) => l.name === league) || {}).id || "chn.1";
        teams.push({ tid, slug, name: c.displayName, league: c.subtitle || league });
      });
    });
    const out = [];
    const needle = fold(namePart);
    for (const team of teams.slice(0, 3)) {
      try {
        const ros = await fetchJSON("https://site.web.api.espn.com/apis/site/v2/sports/soccer/" + team.slug + "/teams/" + team.tid + "/roster");
        const athletes = [];
        (ros.athletes || []).forEach((g) => {
          if (g && g.displayName && g.id) athletes.push(g);
          (g.items || []).forEach((a) => athletes.push(a));
        });
        athletes.forEach((a) => {
          const n = a.displayName || a.fullName || "";
          if (!fold(n).includes(needle)) return;
          out.push({
            id: String(a.id),
            name: n,
            team: team.name,
            league: team.league || "",
            pos: (a.position && a.position.abbreviation) || "",
          });
        });
      } catch { /* roster indispo */ }
    }
    return out;
  }
  async function remoteSearch(q) {

    try {
      const data = await fetchJSON("https://site.web.api.espn.com/apis/search/v2?query=" + encodeURIComponent(q) + "&limit=25");
      const out = [];
      (data.results || []).forEach((block) => {
        const type = String(block.type || block.name || "").toLowerCase();
        if (type && !/player|athlete/.test(type)) return;
        (block.contents || block.items || []).forEach((c) => {
          const web = ((c.link && (c.link.web || c.link.href)) || c.href || "") + " " + (c.sport || "") + " " + (c.description || "");
          const looksSoccer = /soccer|football|ligue|liga|bundes|premier|eredivisie|mls|super lig|pro league/i.test(web);
          const looksOther = /nba|nfl|mlb|nhl|tennis|golf|f1|nascar|wnba|ncaa/i.test(web);
          if (looksOther && !looksSoccer) return;
          const uid = c.uid || c.id || "";
          let id = "";
          if (String(uid).includes("a:")) id = String(uid).split("a:").pop();
          else if (/^\d+$/.test(String(c.id || ""))) id = String(c.id);

          out.push({

            league: c.description || "",
            pos: "",

      const parts = q.trim().split(/\s+/);
      if (parts.length >= 2) {
        const extra = await searchTeamRoster(parts[0], parts.slice(1).join(" "));

  function isNationalOrFriendly(s) {
    return /friendly|nations league|world cup|afcon|\beuro\b|european championship|asian cup|qualifying|copa am[eé]rica|all[- ]?stars|olympics|under-?\d|\bu\d\d\b|youth|espoir/i.test(String(s || ""));
  }
  function isOfficialSeasonLabel(s) {
    const n = String(s || "").toLowerCase();
    if (!n || isNationalOrFriendly(n)) return false;
    if (/2026-27|2026-2027|2026\/27/.test(n)) return true;
    if (/2026/.test(n) && /(mls|major league soccer|usa\.1|chinese|chn\.1|leagues cup|concacaf)/i.test(n)) return true;
    return false;

  function isFavPlayer(id, name) {
    const list = favs();

    return list.some((p) => {
      if (sid && String(p.id) === sid) return true;
      const pn = (p.name || "").toLowerCase().trim();
      return n && pn && (pn === n || pn.includes(n) || n.includes(pn));
    });
  }
  function markFav(name, id) {
    const safe = String(name || "").replace(/</g, "");

  }

  function scorerLine(s, side) {
    const extra = s.kind === "pen" ? " (P)" : s.kind === "csc" ? " (CSC)" : "";

    const assist = s.assist ? ` <span class="assist">(${markFav(s.assist, s.assistId)})</span>` : "";

  function scorerSide(m, s) {
    const tid = String(s.teamId || "");
    if (tid && m.home.id && tid === String(m.home.id)) return "home";
    if (tid && m.away.id && tid === String(m.away.id)) return "away";
    if (s.side === "away" || s.side === "home") return s.side;

  async function loadHotPlayers() {
    if (state.hotPlayers && state.hotPlayers.length) return;
    const slugs = activeLeagues().filter((l) => !["uefa.champions","uefa.europa","uefa.europa.conf","fifa.world","uefa.euro","uefa.nations","conmebol.america","caf.nations","fifa.friendly"].includes(l.id));
    const bag = {};
    await Promise.allSettled(slugs.map(async (l) => {
      const d = await fetchJSON("https://site.web.api.espn.com/apis/site/v2/sports/soccer/" + l.id + "/statistics");
      (d.stats || []).forEach((cat) => {
        const kind = /assist/i.test(cat.name || "") ? "a" : /goal/i.test(cat.name || "") ? "g" : "";
        if (!kind) return;
        (cat.leaders || []).slice(0, 25).forEach((row) => {
          const ath = row.athlete || {};
          const id = String(ath.id || "");
          if (!id) return;
          const sd = row.shortDisplayValue || "";
          const g = Number((sd.match(/G:\s*(\d+)/) || [])[1]);
          const a = Number((sd.match(/A:\s*(\d+)/) || [])[1]);
          const cur = bag[id] || { id, name: ath.displayName || "", team: (ath.team && ath.team.displayName) || "", league: l.name, pos: "", g: 0, a: 0 };
          if (Number.isFinite(g)) cur.g = Math.max(cur.g, g);
          if (Number.isFinite(a)) cur.a = Math.max(cur.a, a);
          if (kind === "g" && !Number.isFinite(g)) cur.g = Math.max(cur.g, Number(row.value) || 0);
          if (kind === "a" && !Number.isFinite(a)) cur.a = Math.max(cur.a, Number(row.value) || 0);
          bag[id] = cur;
        });
      });
    }));
    const list = Object.values(bag).map((p) => {
      p.ga = (p.g || 0) + (p.a || 0);
      p.league = (p.ga ? (p.ga + " G/A · ") : "") + (p.league || "");
      return p;
    }).filter((p) => p.ga > 0).sort((a, b) => b.ga - a.ga);
    state.hotPlayers = list;
    if (state.tab === "favs" && !state.q) render();
  }

  function fact(n) { let r = 1; for (let i = 2; i <= n; i++) r *= i; return r; }
  function poisson(k, lam) { return Math.exp(-lam) * Math.pow(lam, k) / fact(k); }
  function teamPower(form, record) {
    let ppg = 1.2;
    const rec = String(record || "").match(/(\d+)\s*-\s*(\d+)\s*-\s*(\d+)/);
    if (rec) {
      const w = +rec[1], d = +rec[2], l = +rec[3];
      const g = w + d + l;
      if (g) ppg = (3 * w + d) / g;
    }
    const f = String(form || "").toUpperCase();
    let fp = 0, n = 0;
    for (const ch of f) {
      if (ch === "W") { fp += 3; n++; }
      else if (ch === "D") { fp += 1; n++; }
      else if (ch === "L") { n++; }
    }
    const formPpg = n ? fp / n : ppg;
    return Math.max(0.25, Math.min(2.9, 0.58 * ppg + 0.42 * formPpg));
  }
  function analyzeMatch(m) {
    const ph = teamPower(m.home.form, m.home.record);
    const pa = teamPower(m.away.form, m.away.record);
    const diff = ph - pa;
    let lh = 1.18 + diff * 0.62 + 0.22;
    let la = 1.02 - diff * 0.58;
    lh = Math.max(0.45, Math.min(2.7, lh));
    la = Math.max(0.4, Math.min(2.5, la));
    const grid = [];
    let p1 = 0, pN = 0, p2 = 0, best = { h: 1, a: 1, p: 0 };
    for (let i = 0; i <= 5; i++) {
      for (let j = 0; j <= 5; j++) {
        const p = poisson(i, lh) * poisson(j, la);
        grid.push({ i, j, p });
        if (i > j) p1 += p; else if (i === j) pN += p; else p2 += p;
        if (p > best.p) best = { h: i, a: j, p };
      }
    }
    const tot = p1 + pN + p2 || 1;
    return {
      p1: Math.round(1000 * p1 / tot) / 10,
      pN: Math.round(1000 * pN / tot) / 10,
      p2: Math.round(1000 * p2 / tot) / 10,
      score: best.h + "–" + best.a,
      scorePct: Math.round(1000 * best.p / tot) / 10,
      xg: (lh + la).toFixed(1),
    };
  }
  function teamWatchList(team) {
    const names = [team.name, team.full].filter(Boolean);
    const stats = cachedStats();
    const pool = [];
    const seen = new Set();
    const add = (p) => {
      const id = String(p.id || p.name);
      if (seen.has(id)) return;
      seen.add(id);
      const st = stats[p.id] || {};
      pool.push({ id: p.id, name: p.name, team: p.team || "", ga: Number(st.ga) || 0 });
    };
    favs().forEach(add);
    (CATALOG || []).forEach(add);
    const hit = pool.filter((p) => names.some((n) => {
      const a = String(n || "").toLowerCase();
      const b = String(p.team || "").toLowerCase();
      return a && b && (a === b || a.includes(b) || b.includes(a));
    }));
    hit.sort((a, b) => b.ga - a.ga);
    return hit;
  }
  function formBoxes(form) {
    const seq = String(form || "").toUpperCase().replace(/[^WDL]/g, "").slice(-5);
    if (!seq) return "";
    return `<div class="form-boxes">${[...seq].map((ch) => {
      if (ch === "W") return `<i class="fb w">V</i>`;
      if (ch === "D") return `<i class="fb n">N</i>`;
      return `<i class="fb l">D</i>`;
    }).join("")}</div>`;
  }
  function watchPlayers(m) {
    const stats = cachedStats();
    const mine = favs();
    const matchTeam = (p, team) => {
      const a = String(p.team || "").toLowerCase();
      const names = [team.name, team.full].map((x) => String(x || "").toLowerCase()).filter(Boolean);
      return a && names.some((n) => n === a || n.includes(a) || a.includes(n));
    };
    const pick = (team) => mine.filter((p) => matchTeam(p, team)).sort((a, b) => (Number((stats[b.id] || {}).ga) || 0) - (Number((stats[a.id] || {}).ga) || 0));
    const h = pick(m.home);
    const a = pick(m.away);
    const out = [];
    if (h[0]) out.push({ ...h[0], side: m.home.name });
    if (a[0]) out.push({ ...a[0], side: m.away.name });
    if (out.length < 2 && h[1]) out.push({ ...h[1], side: m.home.name });
    if (out.length < 2 && a[1]) out.push({ ...a[1], side: m.away.name });
    return out.slice(0, 2);
  }

  function applyBackup(data) {
    if (!data || data.app !== "gucciman" || !Array.isArray(data.favs)) throw new Error("fichier invalide");
    const favsNow = loadJson(LS_FAV, []);
    const seen = new Set(favsNow.map((p) => String(p.id)));

    data.favs.forEach((p) => {

    const stars = new Set([].concat(loadJson(LS_MATCH_FAV, []), data.matchFavs || []).map(String));
    saveJson(LS_FAV, merged);
    saveJson(LS_MATCH_FAV, [...stars]);
    if (data.settings && typeof data.settings === "object") {

  }

  const FOTMOB_LEAGUES = {

  };

  async function enrichAssistsFotmob(matches) {
    const need = matches.filter((m) => (m.isLive || m.isDone) && (m.scorers || []).some((s) => !s.assist));
    if (!need.length) return;
    const byLeague = {};
    need.forEach((m) => {
      const id = FOTMOB_LEAGUES[m.leagueId];
      if (!id) return;
      (byLeague[id] ||= []).push(m);
    });
    for (const lid of Object.keys(byLeague)) {
      let league;
      try { league = await fetchJSON("https://www.fotmob.com/api/data/leagues?id=" + lid); }
      catch { continue; }
      const all = (((league.fixtures || {}).allMatches) || []);
      for (const m of byLeague[lid]) {
        const day = (m.date || "").slice(0, 10);
        const hs = String(m.home.score), as = String(m.away.score);
        const scoreA = hs + " - " + as;
        const scoreB = as + " - " + hs;
        const dated = all.filter((fx) => {
          const utc = ((fx.status || {}).utcTime || "").slice(0, 10);
          return !day || !utc || day === utc;
        });
        let hit = dated.find((fx) => {
          const home = (fx.home || {}).name || "";
          const away = (fx.away || {}).name || "";
          return (namesMatch(home, m.home.name) && namesMatch(away, m.away.name))
              || (namesMatch(home, m.away.name) && namesMatch(away, m.home.name));
        });
        if (!hit) {
          hit = dated.find((fx) => {
            const sc = ((fx.status || {}).scoreStr || "").replace(/\s+/g, " ").trim();
            return sc === scoreA || sc === scoreB;
          });
        }
        if (!hit) {
          hit = dated.find((fx) => {
            const blob = ((fx.home || {}).name + " " + (fx.away || {}).name).toLowerCase();
            return blob.includes(normName(m.home.name).split(" ").pop())
                && blob.includes(normName(m.away.name).split(" ").pop());
          });
        }
        if (!hit || !hit.id) continue;
        let det;
        try { det = await fetchJSON("https://www.fotmob.com/api/data/matchDetails?matchId=" + hit.id); }
        catch { continue; }
        const evs = ((det.header || {}).events) || {};
        const goals = [];
        Object.values(evs.homeTeamGoals || {}).forEach((arr) => (arr || []).forEach((g) => goals.push(g)));
        Object.values(evs.awayTeamGoals || {}).forEach((arr) => (arr || []).forEach((g) => goals.push(g)));
        m.scorers.forEach((s) => {
          if (s.assist) return;
          const min = parseInt(String(s.minute).replace(/\D/g, ""), 10);
          const g = goals.find((x) => {
            const nm = x.fullName || x.nameStr || (x.player && x.player.name) || "";
            const tm = Number(x.time);
            return namesMatch(nm, s.scorer) && (!min || tm === min || Math.abs(tm - min) <= 1);
          }) || goals.find((x) => {
            const tm = Number(x.time);
            return min && (tm === min || Math.abs(tm - min) <= 1);
          });
          if (!g) return;
          let an = g.assistInput || "";
          if (!an && g.assistStr) {
            const mm = String(g.assistStr).match(/assist by\s+(.+)/i);
            an = mm ? mm[1].trim() : "";
          }
          if (an) {
            s.assist = an;
            s.assistId = String(g.assistPlayerId || "");
          }
        });
      }
    }
  }

  document.querySelectorAll("nav.tabs button").forEach((btn) => {
    btn.addEventListener("click", () => {
      state.tab = btn.dataset.tab;
      document.querySelectorAll("nav.tabs button").forEach((b) => b.classList.toggle("on", b === btn));
      render();
      if (state.tab === "rank") refreshAllStats();
      if (state.tab === "matches") loadMatches();
      if (state.tab === "favs") {
        loadHotPlayers();
        if (!state.matches.length) loadMatches({ silent: true });
      }
    });
  });


  document.getElementById("confirmNo")?.addEventListener("click", hideConfirm);
  document.getElementById("confirmYes")?.addEventListener("click", confirmRemoveFav);
  document.getElementById("confirmBg")?.addEventListener("click", (e) => {
    if (e.target.id === "confirmBg") hideConfirm();
  });

  setTimeout(() => {
    const sp = document.getElementById("splash");
    if (sp) sp.classList.add("hide-title");
  }, 1300);
  setTimeout(() => {
    const sp = document.getElementById("splash");
    if (sp) sp.classList.add("through");
  }, 2500);
  setTimeout(() => {
    const sp = document.getElementById("splash");
    if (sp) sp.remove();
  }, 2900);

  loadMatches();
  refreshAllStats();
  loadHotPlayers();
  setInterval(() => {
    if (state.tab === "matches") loadMatches({ silent: true });
  }, 60000);
})();

</script>
</body>
</html>
